# How CI runs the tests: `cargo nextest run --profile ci`. Locally they run under `cargo test`, as docs/rust.md says.
[profile.ci]
# Every test runs, so one failure doesn't hide another behind it.
fail-fast = false
# No retries, since a test that passes on a second try is flaky, and AGENTS.md says to fix one rather than hide it.
retries = 0
# Two tests at once per core on CI's 16 cores, rather than nextest's one. The tests spend much of their time waiting
# rather than computing, so at one per core every slot is full while the cores are about half idle. More than two
# saved only a few seconds, and loaded the tests enough to widen a race in one of them.
test-threads = 32
# A test takes under 5s, so the log marks one that takes longer, and the end of the run lists them. One that takes
# longer than 10s fails the job, as docs/rust.md says, even if it passed. Those are for CI's test job's runner, 16 cores
# of the 8th Graviton generation or later, at the 32 tests at once above, and a slower runner or fewer cores would need
# them measured again. CI reads how long each took from the report below once every test has run, rather than stopping
# a test at 10s, so one that waits on something that never comes runs on to its own timeout and says what it waited
# for. One still running after 2 minutes has hung, since its waits give up well before then, and is stopped and fails,
# rather than holding the job until its 60-minute limit. `terminate-after` counts periods, so 24 of 5s is 2 minutes.
slow-timeout = { period = "5s", terminate-after = 24 }
final-status-level = "slow"

# How long each test took, in target/nextest/ci/junit.xml, which .github/tests-over-limit.py reads.
[profile.ci.junit]
path = "junit.xml"

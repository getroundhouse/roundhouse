# A long session on a library's lending API, ending in a note on a proposal that names a type and a constant from its start.
field = "proposal_note"
said = "Either is fine, but whichever we pick has to notify in HoldQueue order, and sending a reminder mustn't count as a renewal against RENEWAL_LIMIT."
terms = [
  { written = "HoldQueue", also = ["hold queue"] },
  { written = "RENEWAL_LIMIT", also = ["renewal limit"] },
]

[workspace]
name = "overdue-fines"
branch = "anselm/overdue-fines"
repo = "lendmark-api"
pull_request = "Charge fines on overdue loans, and waive them for card holders under 16"
changed = [
  "src/loans/renew.rs",
  "migrations/0031_fines.sql",
  "src/fines/rates.rs",
  "src/fines/mod.rs",
  "tests/fines.rs",
  "src/fines/waive.rs",
  "src/loans/return_item.rs",
  "src/api/readers.rs",
  "app/src/account/Balance.tsx",
  "migrations/0032_staff_waivers.sql",
]

[[chat]]
person = """
A reader renewed a book four times last week, past RENEWAL_LIMIT, while someone else had a hold on it. I think renew doesn't look at the HoldQueue at all."""

[[chat]]
call = { kind = "read", path = "src/loans/renew.rs" }

[[chat]]
call = { kind = "read", path = "src/holds/queue.rs" }

[[chat]]
agent = """
Right on both counts. `renew` checks `loan.renewals < RENEWAL_LIMIT`, but it reads `renewals` before taking the loan's row lock, so two quick renewals can both pass. And it never asks `HoldQueue::next_for(item)` whether anyone is waiting.

I'll take the lock first and refuse a renewal when the queue isn't empty."""

[[chat]]
call = { kind = "edit", path = "src/loans/renew.rs", edits = [{ old = "    let loan = Loan::find(&tx, loan_id).await?;\n    if loan.renewals >= RENEWAL_LIMIT {", new = "    let loan = Loan::find_for_update(&tx, loan_id).await?;\n    if HoldQueue::next_for(&tx, loan.item).await?.is_some() {\n        return Err(RenewError::OnHold);\n    }\n    if loan.renewals >= RENEWAL_LIMIT {" }] }

[[chat]]
call = { kind = "command", command = "cargo test -p lendmark-api renew", description = "Run the renewal tests" }

[[chat]]
person = "Good. While you're in loans: we've never charged fines. The board wants them from January."

[[chat]]
agent = "What are the rates, and is there a cap?"

[[chat]]
person = "20p a day for adult books, 10p for children's, capped at the book's replacement cost. Nothing for anyone under 16."

[[chat]]
call = { kind = "search", pattern = "replacement_cost", path = "src" }

[[chat]]
call = { kind = "read", path = "src/items/model.rs" }

[[chat]]
call = { kind = "read", path = "src/readers/model.rs" }

[[chat]]
agent = """
Items have `replacement_cost` in pence and a `shelf` that says whether they're children's. Readers have `date_of_birth`, so I can tell who's under 16 on the day a fine would start.

I'll keep money as integer pence throughout."""

[[chat]]
call = { kind = "write", path = "migrations/0031_fines.sql", content = "CREATE TABLE fines (\n    id BIGSERIAL PRIMARY KEY,\n    loan_id BIGINT NOT NULL REFERENCES loans (id),\n    pence INTEGER NOT NULL CHECK (pence >= 0),\n    waived_because TEXT,\n    charged_at TIMESTAMPTZ NOT NULL DEFAULT now()\n);\n" }

[[chat]]
call = { kind = "write", path = "src/fines/rates.rs", content = "use crate::items::Shelf;\n\npub const ADULT_PENCE_PER_DAY: u32 = 20;\npub const CHILDREN_PENCE_PER_DAY: u32 = 10;\n\npub fn per_day(shelf: Shelf) -> u32 {\n    match shelf {\n        Shelf::Children => CHILDREN_PENCE_PER_DAY,\n        Shelf::Adult | Shelf::Reference => ADULT_PENCE_PER_DAY,\n    }\n}\n" }

[[chat]]
call = { kind = "write", path = "src/fines/mod.rs", content = "mod rates;\nmod waive;\n\npub fn owed(days_late: u32, shelf: Shelf, replacement_pence: u32) -> u32 {\n    (days_late * rates::per_day(shelf)).min(replacement_pence)\n}\n" }

[[chat]]
call = { kind = "command", command = "cargo check -p lendmark-api", description = "Check the crate builds" }

[[chat]]
agent = "Rates and the cap are in. `days_late * per_day` can't overflow a `u32` for any loan shorter than 500 years, so I've left it plain."

[[chat]]
person = "Ha. What counts as a day late? The library's shut on Sundays."

[[chat]]
agent = "Good point. Should closed days count? If a book's due Saturday and comes back Monday, is that one day or two?"

[[chat]]
person = "One. Don't count days we're closed, and that includes bank holidays."

[[chat]]
call = { kind = "search", pattern = "opening_hours", path = "src" }

[[chat]]
call = { kind = "read", path = "src/branches/hours.rs" }

[[chat]]
agent = "Each branch has its opening hours, and closures are in `branch_closures`. I'll count only the days the returning branch was open."

[[chat]]
call = { kind = "edit", path = "src/fines/mod.rs", edits = [{ old = "pub fn owed(days_late: u32, shelf: Shelf, replacement_pence: u32) -> u32 {", new = "pub fn days_late(due: NaiveDate, returned: NaiveDate, branch: &Branch) -> u32 {\n    due.iter_days().skip(1).take_while(|d| *d <= returned).filter(|d| branch.open_on(*d)).count() as u32\n}\n\npub fn owed(days_late: u32, shelf: Shelf, replacement_pence: u32) -> u32 {" }] }

[[chat]]
call = { kind = "write", path = "tests/fines.rs", content = "#[test]\nfn saturday_to_monday_is_one_day() {\n    let branch = branch_closed_on_sundays();\n    assert_eq!(days_late(date(2026, 11, 21), date(2026, 11, 23), &branch), 1);\n}\n\n#[test]\nfn capped_at_replacement_cost() {\n    assert_eq!(owed(400, Shelf::Adult, 1_299), 1_299);\n}\n" }

[[chat]]
call = { kind = "command", command = "cargo test -p lendmark-api --test fines", description = "Run the fines tests" }

[[chat]]
agent = "Both pass. Now the waiver for under-16s."

[[chat]]
call = { kind = "write", path = "src/fines/waive.rs", content = "pub enum Waived {\n    Under16,\n}\n\npub fn waived(reader: &Reader, on: NaiveDate) -> Option<Waived> {\n    (reader.age_on(on) < 16).then_some(Waived::Under16)\n}\n" }

[[chat]]
call = { kind = "edit", path = "tests/fines.rs", edits = [{ old = "#[test]\nfn capped_at_replacement_cost() {", new = "#[test]\nfn no_fine_for_a_fifteen_year_old() {\n    let reader = reader_born(date(2011, 6, 1));\n    assert!(waived(&reader, date(2026, 11, 23)).is_some());\n}\n\n#[test]\nfn capped_at_replacement_cost() {" }] }

[[chat]]
call = { kind = "command", command = "cargo test -p lendmark-api --test fines", description = "Run the fines tests" }

[[chat]]
person = "Age on which day? If they turn 16 halfway through being late?"

[[chat]]
agent = "I used the return date. Would you rather use the due date, so a reader who was 15 when the book fell due pays nothing?"

[[chat]]
person = "Due date. It's kinder, and easier to explain at the desk."

[[chat]]
call = { kind = "edit", path = "src/fines/mod.rs", edits = [{ old = "waived(&reader, returned)", new = "waived(&reader, loan.due)" }] }

[[chat]]
call = { kind = "command", command = "cargo test -p lendmark-api --test fines", description = "Run the fines tests" }

[[chat]]
agent = "Waivers now go by the due date. A waived fine is still recorded, with `waived_because = 'under_16'` and zero pence, so the reports can count them."

[[chat]]
person = "Where does the fine get charged? On return?"

[[chat]]
call = { kind = "search", pattern = "fn return_item", path = "src" }

[[chat]]
call = { kind = "read", path = "src/loans/return_item.rs" }

[[chat]]
call = { kind = "edit", path = "src/loans/return_item.rs", edits = [{ old = "    loan.mark_returned(&tx, now).await?;", new = "    loan.mark_returned(&tx, now).await?;\n    fines::charge(&tx, &loan, &reader, &branch, now.date_naive()).await?;" }] }

[[chat]]
call = { kind = "command", command = "cargo test -p lendmark-api", description = "Run all the API's tests" }

[[chat]]
agent = "Yes, on return, in the same transaction as marking the loan returned, so a crash can't return a book without its fine. All 188 tests pass."

[[chat]]
person = "Readers should see what they owe in the app."

[[chat]]
call = { kind = "read", path = "src/api/readers.rs" }

[[chat]]
call = { kind = "edit", path = "src/api/readers.rs", edits = [{ old = "pub struct ReaderSummary {\n    pub name: String,\n    pub loans: Vec<LoanSummary>,\n}", new = "pub struct ReaderSummary {\n    pub name: String,\n    pub loans: Vec<LoanSummary>,\n    pub fines_owed_pence: u32,\n}" }] }

[[chat]]
call = { kind = "command", command = "cargo test -p lendmark-api api::readers", description = "Run the reader API tests" }

[[chat]]
agent = "`GET /readers/me` now includes `fines_owed_pence`, the sum of their unpaid, unwaived fines."

[[chat]]
person = "Pence is fine for the API, but the app should show pounds."

[[chat]]
call = { kind = "search", pattern = "ReaderSummary", path = "app/src" }

[[chat]]
call = { kind = "edit", path = "app/src/account/Balance.tsx", edits = [{ old = "export function Balance({ summary }: Props) {\n  return null;\n}", new = "const pounds = new Intl.NumberFormat(\"en-GB\", { style: \"currency\", currency: \"GBP\" });\n\nexport function Balance({ summary }: Props) {\n  if (summary.fines_owed_pence === 0) return null;\n  return <p className=\"balance\">You owe {pounds.format(summary.fines_owed_pence / 100)}</p>;\n}" }] }

[[chat]]
agent = "The account page shows \"You owe £1.20\" when there's something owed, and nothing when there isn't."

[[chat]]
person = "Can staff waive a fine at the desk?"

[[chat]]
agent = "Not yet. Should a staff waiver need a reason?"

[[chat]]
person = "Yes, free text, and record who did it."

[[chat]]
call = { kind = "write", path = "migrations/0032_staff_waivers.sql", content = "ALTER TABLE fines ADD COLUMN waived_by BIGINT REFERENCES staff (id);\nALTER TABLE fines ADD COLUMN waiver_note TEXT;\n" }

[[chat]]
call = { kind = "edit", path = "src/fines/waive.rs", edits = [{ old = "pub enum Waived {\n    Under16,\n}", new = "pub enum Waived {\n    Under16,\n    ByStaff { staff: StaffId, note: String },\n}" }] }

[[chat]]
call = { kind = "command", command = "cargo test -p lendmark-api", description = "Run all the API's tests" }

[[chat]]
agent = "Staff can waive a fine with a note, and the fine keeps who waived it. Tests pass."

[[chat]]
person = "And the readers need to know before it gets that far. Can we remind them a few days before something's due?"

[[chat]]
agent = "Yes. There are two reasonable ways to send it, and they differ in what we'd have to run. I'll write them up as a proposal."

[[chat]]
call = { kind = "read", path = "src/notify/email.rs" }

[[chat]]
call = { kind = "search", pattern = "web_push", path = "src" }

[[chat]]
call = { kind = "command", command = "psql lendmark -c \"SELECT count(*) FILTER (WHERE email IS NOT NULL), count(*) FILTER (WHERE push_endpoint IS NOT NULL), count(*) FROM readers\"", description = "Count readers with each way to reach them" }

[[chat]]
agent = "Proposal's up. 71% of readers have an email address and 18% have allowed push notifications in the app."

[proposal]
title = "Remind readers before a loan is due"
context = """
Fines start in January, so a reminder a few days before the due date saves readers money and the desk arguments. `notify::email` already sends hold-ready emails through the council's SMTP relay."""

[[proposal.questions]]
header = "Channel"
text = "How should the reminder reach readers?"
details = "Either way, a nightly job picks loans due in three open days and sends one reminder per reader, listing all their items."
options = [
  { label = "Email", description = "Reuse `notify::email`; reaches 71% of readers.", body = "No new infrastructure. Readers without an email get nothing." },
  { label = "Email and push", description = "Email, plus a web push to the 18% who've allowed it.", body = "Needs VAPID keys and a push worker, but push is what readers see first." },
]

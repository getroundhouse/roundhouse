[package]
name = "policy"
description = "Tests that enforce the repo's licensing, dependency, file length, doc length and lint rules."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dev-dependencies]
# To read the design's canvases and films as its index does.
design.workspace = true
kit-sync.workspace = true
# To read the dependency graph once for every test of a run.
process = { workspace = true, features = ["testing"] }
proc-macro2.workspace = true
ring.workspace = true
serde_json.workspace = true
toml.workspace = true

[lints]
workspace = true

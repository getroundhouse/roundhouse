# Builds the app from each merge to main and publishes it as an update: signed, notarized, and listed in a feed signed
# so the app can check it. The build job has no secrets. On a PR that changes how the app is built, packaged or
# released, it packages the app signed ad hoc and runs the checks a release gets, so the PR shows packaging still
# works. Nothing here can block a merge, since the ruleset requires only ci.yml's `checks`, which runs publish.py's
# tests. The keys are in the `release` environment, which only main can use, so signing, notarizing and publishing
# only run after a merge. The merge queue has already run the checks by then.
#
# The Windows app goes the same way in jobs of its own, so neither platform's release waits on the other's or fails
# with it: built on Windows, with no secrets, then packaged by vpk on Linux, which packages for Windows, and published
# to a feed of its own in the same bucket. It's unsigned, so Windows warns whoever downloads the installer. x64 and
# ARM64 each go through those jobs, and one failing leaves the other's release alone.
#
# The `release` environment's secrets:
#   APPLE_DEVELOPER_ID_P12, APPLE_DEVELOPER_ID_P12_PASSWORD  The Developer ID Application certificate and key, a .p12
#                                                            in base64, and its password
#   APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID  The App Store Connect key notarytool uses, the .p8 file's
#                                                            text, and its IDs
#   FEED_SIGNING_KEY                                         The update feed's private key, a PKCS#8 PEM file's text
#   B2_RELEASES_KEY_ID, B2_RELEASES_KEY                      A Backblaze key that can read and write the bucket
# The repository's variables:
#   RELEASES_BUCKET, RELEASES_S3_ENDPOINT, RELEASES_REGION   The bucket, through its S3 API
# Where apps read the update feed, and its public key, are the ones the app builds in, from
# apps/desktop/src/updates/update-feed.url and update-feed.key.
name: Release

on:
  push:
    branches: [main]
    # Docs and the marketing site don't change the app, so alone they'd only publish an update with nothing in it.
    paths-ignore:
      - "**.md"
      - docs/**
      - site/**
      - tools/site/**
  pull_request:
    paths:
      - tools/package/**
      - tools/build.sh
      - Cargo.lock
      - rust-toolchain.toml
      - apps/desktop/icons/**
      - apps/desktop/src/updates/update-feed.*
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

# One release at a time. A build on main is never cancelled: merges come about as often as a build takes, so
# cancelling would mean none ever finishes, and GitHub keeps only the newest run waiting behind it. A PR's run is
# only a check, so a newer push replaces it.
concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Compiles every dependency, so it runs where no key is.
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # package.sh counts the commits for the version.
          fetch-depth: 0
          persist-credentials: false
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # Not mac-, which mac.yml restores from, since this target/ holds release builds.
          key: release-mac-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: release-mac-
      - name: Build
        id: build
        run: |
          build="$(tools/build.sh --package "$RUNNER_TEMP/binaries")"
          echo "build=$build" >> "$GITHUB_OUTPUT"
      # From the binaries, as the release job packages them. Signed ad hoc, so package.sh also checks the signature,
      # the hardened runtime and the entitlements. The runner image has .NET's SDKs.
      - name: Package, signed ad hoc
        run: tools/package/package.sh --prebuilt "$RUNNER_TEMP/binaries" --out "$RUNNER_TEMP/package" --sign -
      - name: Run the packaged CLI and a hub from the package
        env:
          BUILD: ${{ steps.build.outputs.build }}
        run: |
          cli="$RUNNER_TEMP/package/Roundhouse.app/Contents/MacOS/roundhouse"
          export ROUNDHOUSE_HOME="$RUNNER_TEMP/smoke/home" ROUNDHOUSE_WORKSPACES="$RUNNER_TEMP/smoke/workspaces"
          # Needs a hub, so it starts one.
          "$cli" repo list
          "$cli" hub status | tee "$RUNNER_TEMP/smoke/status.txt"
          "$cli" hub stop
          grep -q " version $BUILD " "$RUNNER_TEMP/smoke/status.txt"
      - name: Keep the binaries for the release job
        if: github.ref == 'refs/heads/main'
        run: tar -cf "$RUNNER_TEMP/binaries.tar" -C "$RUNNER_TEMP/binaries" .
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: ${{ runner.temp }}/binaries.tar
          if-no-files-found: error
          retention-days: 7
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # Signs, notarizes and publishes the build job's binaries. It compiles nothing, and each key is only in the steps
  # that use it, which remove what they wrote. Running it again is safe: it finishes a release that stopped partway,
  # and leaves a finished one be.
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: macos-26
    timeout-minutes: 60
    env:
      STORE: s3://${{ vars.RELEASES_BUCKET }}
      S3_ENDPOINT: ${{ vars.RELEASES_S3_ENDPOINT }}
      S3_REGION: ${{ vars.RELEASES_REGION }}
      NOTARY_PROFILE: roundhouse
      # How many releases the feed lists, and the bucket keeps packages for.
      KEEP: "10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: ${{ runner.temp }}
      # Outside the checkout, and empty, since publish.py starts from an empty directory.
      - run: |
          echo "PACKAGE=$RUNNER_TEMP/package" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"
          version="$(tools/package/package.sh --print-version)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # So the feed is checked, signed and published for the apps this publishes.
          key="$(cat apps/desktop/src/updates/update-feed.key)"
          echo "FEED_PUBLIC_KEY=$key" >> "$GITHUB_ENV"
          url="$(cat apps/desktop/src/updates/update-feed.url)"
          echo "UPDATE_URL=$url" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/binaries"
          tar -xf "$RUNNER_TEMP/binaries.tar" -C "$RUNNER_TEMP/binaries"

      # Before any key is set up, so a version no app would take, one that isn't newer than every published release,
      # stops here. Only once the published feed matches its signature, so nothing in the bucket gets into the feed
      # this signs.
      - name: Read the published feed
        id: feed
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_RELEASES_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_RELEASES_KEY }}
        run: |
          state="$(tools/package/publish.py prepare --store "$STORE" --key "$FEED_PUBLIC_KEY" --version "$VERSION" \
            --work "$PACKAGE")"
          echo "$VERSION is $state"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Put the Developer ID in a keychain of its own
        if: steps.feed.outputs.state == 'new'
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/developer-id.pem"' EXIT
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$password" "$KEYCHAIN"
          # Decrypted with OpenSSL 3, not macOS's LibreSSL, and the password from the environment, since a command
          # line is visible to every process. -legacy reads the RC2 a .p12 that macOS exported uses, as well as AES.
          # Then imported as the key and certificate it holds, which need no password.
          openssl="$(tools/package/feed-signature.sh openssl)"
          (umask 077 && printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12")
          (umask 077 && "$openssl" pkcs12 -legacy -in "$RUNNER_TEMP/developer-id.p12" -passin env:P12_PASSWORD -nodes \
            -out "$RUNNER_TEMP/developer-id.pem")
          # -x leaves the private key unexportable.
          security import "$RUNNER_TEMP/developer-id.pem" -k "$KEYCHAIN" -f pemseq -t agg -x -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$KEYCHAIN" > /dev/null
          # codesign only finds an identity in a keychain on the search list, which keeps the ones already on it.
          keychains=()
          while IFS= read -r keychain; do
            keychains+=("$keychain")
          done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          security list-keychains -d user -s "$KEYCHAIN" "${keychains[@]}"
          # Its hash, so the log never names whose certificate it is.
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk '/"Developer ID Application: / { print $2; exit }')"
          [ -n "$identity" ] || { echo "::error::The certificate has no Developer ID Application identity"; exit 1; }
          echo "IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Store the notarizing key for notarytool
        if: steps.feed.outputs.state == 'new'
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/notary.p8"' EXIT
          # The .p8 file's text. The file ends in one newline, whether the secret ends in one or not.
          key="${KEY%$'\n'}"
          [[ "$key" == "-----BEGIN PRIVATE KEY-----"$'\n'* ]] \
            || { echo "::error::APPLE_API_KEY_P8 isn't the text of a .p8 file"; exit 1; }
          (umask 077 && printf '%s\n' "$key" > "$RUNNER_TEMP/notary.p8")
          xcrun notarytool store-credentials "$NOTARY_PROFILE" --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" \
            --issuer "$ISSUER" --keychain "$KEYCHAIN"
      # vpk makes a delta from the newest full package, which prepare put in releases/. package.sh checks Gatekeeper
      # takes the app as notarized, and that the ticket is stapled.
      - name: Package, sign and notarize
        if: steps.feed.outputs.state == 'new'
        run: |
          tools/package/package.sh --prebuilt "$RUNNER_TEMP/binaries" --out "$PACKAGE" --sign "$IDENTITY" \
            --keychain "$KEYCHAIN" --notary-profile "$NOTARY_PROFILE"
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" 2> /dev/null || true

      - name: Sign the new feed
        if: steps.feed.outputs.state == 'new'
        env:
          FEED_SIGNING_KEY: ${{ secrets.FEED_SIGNING_KEY }}
        run: |
          feed="$(tools/package/publish.py merge --version "$VERSION" --keep "$KEEP" --work "$PACKAGE")"
          trap 'rm -f "$RUNNER_TEMP/feed.pem"' EXIT
          (umask 077 && printf '%s\n' "$FEED_SIGNING_KEY" > "$RUNNER_TEMP/feed.pem")
          # Checks the signature against the app's key too, since a feed signed with another, every app refuses.
          tools/package/feed-signature.sh sign "$feed" "$RUNNER_TEMP/feed.pem" "$FEED_PUBLIC_KEY"
      - name: Publish
        if: steps.feed.outputs.state == 'new'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_RELEASES_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_RELEASES_KEY }}
        run: |
          tools/package/publish.py upload --store "$STORE" --key "$FEED_PUBLIC_KEY" --version "$VERSION" \
            --work "$PACKAGE"
      - name: Check what apps read
        run: |
          tools/package/publish.py check --url "$UPDATE_URL" --key "$FEED_PUBLIC_KEY" --version "$VERSION" \
            --work "$PACKAGE"

  # The Windows binaries, built where they run, on the org's 8-core Windows runners, since a cold build took half an
  # hour on the standard one. It compiles every dependency, so no key is here.
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            runner: windows-latest-amd64-8cores
          - arch: arm64
            target: aarch64-pc-windows-msvc
            runner: windows-latest-arm64-8cores
    runs-on: ${{ matrix.runner }}
    env:
      # Named, so the binaries are for this processor whichever one the runner's own toolchain is for. build.sh
      # reads it too.
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    timeout-minutes: 90
    defaults:
      run:
        # Git's, which the runner has, so tools/build.sh runs as it does on a Mac.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # build.sh counts the commits for the version.
          fetch-depth: 0
          persist-credentials: false
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # Not windows-, which windows.yml restores from, since this target/ holds release builds.
          key: release-windows-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: release-windows-${{ matrix.arch }}-
      - name: Build
        id: build
        run: |
          rustup target add "$CARGO_BUILD_TARGET"
          build="$(tools/build.sh --package "$RUNNER_TEMP/binaries")"
          echo "build=$build" >> "$GITHUB_OUTPUT"
      # What package.sh checks of the Mac's binaries, which packaging on Linux can't run. A package's build is its
      # version, so this is what the hub and the CLI will say they are. Short, because a hub left running by a step
      # that failed could hold the step open.
      - name: Run the built CLI and a hub from the build
        timeout-minutes: 5
        env:
          BUILD: ${{ steps.build.outputs.build }}
        run: |
          bins="$RUNNER_TEMP/binaries"
          mkdir -p "$RUNNER_TEMP/smoke"
          export ROUNDHOUSE_HOME="$RUNNER_TEMP/smoke/home" ROUNDHOUSE_WORKSPACES="$RUNNER_TEMP/smoke/workspaces"
          # Whatever fails, no hub is left behind.
          trap '"$bins/roundhouse.exe" hub stop > /dev/null 2>&1 || true' EXIT
          for bin in roundhoused roundhouse; do
            said="$("$bins/$bin.exe" --version)"
            [ "$said" = "$bin $BUILD" ] || { echo "::error::$bin says it's \"$said\", not $BUILD"; exit 1; }
          done
          # Needs a hub, so it starts one, from the copy of the daemon a stamped build makes.
          "$bins/roundhouse.exe" repo list
          "$bins/roundhouse.exe" hub status | tee "$RUNNER_TEMP/smoke/status.txt"
          "$bins/roundhouse.exe" hub stop
          grep -q " version $BUILD " "$RUNNER_TEMP/smoke/status.txt"
      - name: Show the hub's log
        if: always()
        run: cat "$RUNNER_TEMP/smoke/home/hub.log" || true
      # On a PR too, since packaging is checked from them.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-binaries-${{ matrix.arch }}
          path: ${{ runner.temp }}/binaries
          if-no-files-found: error
          retention-days: 7
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # On a PR, packages the Windows binaries as the release job below does, so the PR shows packaging still works. The
  # runner image has .NET's SDK. It runs even if one processor's build failed, and then only that one's fails here,
  # for want of its binaries.
  package-windows:
    needs: build-windows
    if: ${{ !cancelled() && github.ref != 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-binaries-${{ matrix.arch }}
          path: ${{ runner.temp }}/binaries
      - env:
          ARCH: ${{ matrix.arch }}
        run: |
          tools/package/package-windows.sh --arch "$ARCH" --prebuilt "$RUNNER_TEMP/binaries" \
            --out "$RUNNER_TEMP/package"
      - run: ls -l "$RUNNER_TEMP/package/releases"

  # Packages and publishes the Windows binaries. It compiles nothing, and each key is only in the steps that use it.
  # Running it again is safe, as for the Mac's. Each processor's goes to a channel of its own, and runs even if the
  # other's build failed.
  release-windows:
    needs: build-windows
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            channel: win
          - arch: arm64
            channel: win-arm64
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARCH: ${{ matrix.arch }}
      CHANNEL: ${{ matrix.channel }}
      STORE: s3://${{ vars.RELEASES_BUCKET }}
      S3_ENDPOINT: ${{ vars.RELEASES_S3_ENDPOINT }}
      S3_REGION: ${{ vars.RELEASES_REGION }}
      # How many releases the feed lists, and the bucket keeps packages for.
      KEEP: "10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-binaries-${{ matrix.arch }}
          path: ${{ runner.temp }}/binaries
      # Outside the checkout, and empty, since publish.py starts from an empty directory.
      - run: |
          echo "PACKAGE=$RUNNER_TEMP/package" >> "$GITHUB_ENV"
          version="$(tools/package/package-windows.sh --print-version)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          key="$(cat apps/desktop/src/updates/update-feed.key)"
          echo "FEED_PUBLIC_KEY=$key" >> "$GITHUB_ENV"
          url="$(cat apps/desktop/src/updates/update-feed.url)"
          echo "UPDATE_URL=$url" >> "$GITHUB_ENV"

      # Before the feed's key is set up, so a version no app would take stops here, and only once the published feed
      # matches its signature, so nothing in the bucket gets into the feed this signs.
      - name: Read the published feed
        id: feed
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_RELEASES_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_RELEASES_KEY }}
        run: |
          state="$(tools/package/publish.py --channel "$CHANNEL" prepare --store "$STORE" --key "$FEED_PUBLIC_KEY" \
            --version "$VERSION" --work "$PACKAGE")"
          echo "$VERSION is $state"
          echo "state=$state" >> "$GITHUB_OUTPUT"
      # vpk makes a delta from the newest full package, which prepare put in releases/.
      - name: Package
        if: steps.feed.outputs.state == 'new'
        run: tools/package/package-windows.sh --arch "$ARCH" --prebuilt "$RUNNER_TEMP/binaries" --out "$PACKAGE"
      - name: Sign the new feed
        if: steps.feed.outputs.state == 'new'
        env:
          FEED_SIGNING_KEY: ${{ secrets.FEED_SIGNING_KEY }}
        run: |
          feed="$(tools/package/publish.py --channel "$CHANNEL" merge --version "$VERSION" --keep "$KEEP" \
            --work "$PACKAGE")"
          trap 'rm -f "$RUNNER_TEMP/feed.pem"' EXIT
          (umask 077 && printf '%s\n' "$FEED_SIGNING_KEY" > "$RUNNER_TEMP/feed.pem")
          tools/package/feed-signature.sh sign "$feed" "$RUNNER_TEMP/feed.pem" "$FEED_PUBLIC_KEY"
      - name: Publish
        if: steps.feed.outputs.state == 'new'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_RELEASES_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_RELEASES_KEY }}
        run: |
          tools/package/publish.py --channel "$CHANNEL" upload --store "$STORE" --key "$FEED_PUBLIC_KEY" \
            --version "$VERSION" --work "$PACKAGE"
      - name: Check what apps read
        run: |
          tools/package/publish.py --channel "$CHANNEL" check --url "$UPDATE_URL" --key "$FEED_PUBLIC_KEY" \
            --version "$VERSION" --work "$PACKAGE"

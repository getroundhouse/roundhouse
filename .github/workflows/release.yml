# Builds each merge to main and publishes it as a signed, notarized update in a signed feed. On a PR that touches
# building, packaging or releasing, it packages signed ad hoc and runs a release's checks. It can't block a merge. The
# keys are in the `release` environment, which only main can use, and the build jobs have none.
#
# Each Windows and Linux build, amd64 and ARM64, is packaged by vpk on Linux and published to a feed of its own, apart
# from the others. The Windows app is unsigned. The Linux app is an AppImage built in Ubuntu 22.04, for its older glibc.
#
# The `release` environment's secrets:
#   APPLE_DEVELOPER_ID_P12, APPLE_DEVELOPER_ID_P12_PASSWORD  The Developer ID Application certificate and key, a .p12
#                                                            in base64, and its password
#   APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID  The App Store Connect key notarytool uses, the .p8 file's
#                                                            text, and its IDs
#   FEED_SIGNING_KEY                                         The update feed's private key, a PKCS#8 PEM file's text
#   B2_RELEASES_KEY_ID, B2_RELEASES_KEY                      A Backblaze key that can read and write the bucket
# The repository's variables:
#   RELEASES_BUCKET, RELEASES_S3_ENDPOINT, RELEASES_REGION   The bucket, through its S3 API
# The feed's address and key are apps/desktop/src/updates/update-feed.url and update-feed.key.
name: Release

on:
  push:
    branches: [main]
    # Docs and the site alone would publish an empty update.
    paths-ignore:
      - "**.md"
      - docs/**
      - site/**
      - tools/site/**
  pull_request:
    paths:
      - tools/package/**
      - tools/build.sh
      - Cargo.lock
      - rust-toolchain.toml
      - apps/desktop/icons/**
      - apps/desktop/src/updates/update-feed.*
      - .github/workflows/release.yml
      - .github/install-linux-packages.sh
  workflow_dispatch:

permissions:
  contents: read

# A PR's run is a check, so a newer push replaces it. On main, each platform and processor has a group for builds and
# one for releases, so a slow Windows build delays only Windows, and a build runs while the last is released. A group
# keeps only its newest waiting job, so a newer merge replaces a build that hasn't started. Started builds are never
# cancelled, or with merges this frequent none would finish. Releases stay in merge order, as publish.py needs.
concurrency:
  group: release-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Compiles every dependency, so it runs where no key is.
  build:
    runs-on: macos-26
    timeout-minutes: 45
    concurrency:
      group: release-build-mac-${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # package.sh counts the commits for the version.
          fetch-depth: 0
          persist-credentials: false
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # Not mac.yml's, since this holds release builds.
          key: release-mac-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: release-mac-
      - name: Build
        id: build
        run: |
          build="$(tools/build.sh --package "$RUNNER_TEMP/binaries")"
          echo "build=$build" >> "$GITHUB_OUTPUT"
      # Signed ad hoc, so package.sh checks the signature, hardened runtime and entitlements.
      - name: Package, signed ad hoc
        run: tools/package/package.sh --prebuilt "$RUNNER_TEMP/binaries" --out "$RUNNER_TEMP/package" --sign -
      # Short, since a hub a failed step left running could hold it open.
      - name: Run the packaged CLI and a hub from the package
        timeout-minutes: 5
        env:
          BUILD: ${{ steps.build.outputs.build }}
        run: |
          tools/package/smoke.sh "$RUNNER_TEMP/package/Roundhouse.app/Contents/MacOS" "$BUILD" "$RUNNER_TEMP/smoke"
      - name: Show the hub's log
        if: always()
        run: cat "$RUNNER_TEMP/smoke/home/hub.log" || true
      - name: Keep the binaries for the release job
        if: github.ref == 'refs/heads/main'
        run: tar -cf "$RUNNER_TEMP/binaries.tar" -C "$RUNNER_TEMP/binaries" .
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: ${{ runner.temp }}/binaries.tar
          if-no-files-found: error
          retention-days: 7
      # Only the dependencies are worth keeping, as in ci.yml, and these are release builds.
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: cargo clean --workspace --release
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # Signs, notarizes and publishes the build's binaries. Each key is only in the steps that use it, which remove what
  # they wrote. Safe to rerun.
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: macos-26
    timeout-minutes: 60
    concurrency:
      group: release-publish-mac-${{ github.ref }}
    env:
      STORE: s3://${{ vars.RELEASES_BUCKET }}
      S3_ENDPOINT: ${{ vars.RELEASES_S3_ENDPOINT }}
      S3_REGION: ${{ vars.RELEASES_REGION }}
      NOTARY_PROFILE: roundhouse
      # How many releases the feed and the bucket keep.
      KEEP: "10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: ${{ runner.temp }}
      # Outside the checkout, and empty, as publish.py needs.
      - run: |
          echo "PACKAGE=$RUNNER_TEMP/package" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"
          version="$(tools/package/package.sh --print-version)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # The feed address and key the app builds in.
          key="$(cat apps/desktop/src/updates/update-feed.key)"
          echo "FEED_PUBLIC_KEY=$key" >> "$GITHUB_ENV"
          url="$(cat apps/desktop/src/updates/update-feed.url)"
          echo "UPDATE_URL=$url" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/binaries"
          tar -xf "$RUNNER_TEMP/binaries.tar" -C "$RUNNER_TEMP/binaries"

      # Before any key is set up: stops a version no newer than the feed's, and checks the published feed's signature,
      # so nothing else in the bucket gets into the feed this signs.
      - name: Read the published feed
        id: feed
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_RELEASES_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_RELEASES_KEY }}
        run: |
          state="$(tools/package/publish.py prepare --store "$STORE" --key "$FEED_PUBLIC_KEY" --version "$VERSION" \
            --work "$PACKAGE")"
          echo "$VERSION is $state"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Put the Developer ID in a keychain of its own
        if: steps.feed.outputs.state == 'new'
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/developer-id.pem"' EXIT
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$password" "$KEYCHAIN"
          # OpenSSL 3, not LibreSSL, with the password from the environment, since a command line is visible to every
          # process. -legacy reads RC2, which macOS exports with. Then imported as a key and certificate, with no
          # password.
          openssl="$(tools/package/feed-signature.sh openssl)"
          (umask 077 && printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12")
          (umask 077 && "$openssl" pkcs12 -legacy -in "$RUNNER_TEMP/developer-id.p12" -passin env:P12_PASSWORD -nodes \
            -out "$RUNNER_TEMP/developer-id.pem")
          # -x leaves the private key unexportable.
          security import "$RUNNER_TEMP/developer-id.pem" -k "$KEYCHAIN" -f pemseq -t agg -x -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$KEYCHAIN" > /dev/null
          # codesign only looks in keychains on the search list.
          keychains=()
          while IFS= read -r keychain; do
            keychains+=("$keychain")
          done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          security list-keychains -d user -s "$KEYCHAIN" "${keychains[@]}"
          # Its hash, so the log never names whose certificate it is.
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk '/"Developer ID Application: / { print $2; exit }')"
          [ -n "$identity" ] || { echo "::error::The certificate has no Developer ID Application identity"; exit 1; }
          echo "IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Store the notarizing key for notarytool
        if: steps.feed.outputs.state == 'new'
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/notary.p8"' EXIT
          # The .p8 file's text, ending in one newline either way.
          key="${KEY%$'\n'}"
          [[ "$key" == "-----BEGIN PRIVATE KEY-----"$'\n'* ]] \
            || { echo "::error::APPLE_API_KEY_P8 isn't the text of a .p8 file"; exit 1; }
          (umask 077 && printf '%s\n' "$key" > "$RUNNER_TEMP/notary.p8")
          xcrun notarytool store-credentials "$NOTARY_PROFILE" --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" \
            --issuer "$ISSUER" --keychain "$KEYCHAIN"
      # vpk deltas from the newest full package, which prepare fetched. package.sh checks notarization and stapling.
      - name: Package, sign and notarize
        if: steps.feed.outputs.state == 'new'
        run: |
          tools/package/package.sh --prebuilt "$RUNNER_TEMP/binaries" --out "$PACKAGE" --sign "$IDENTITY" \
            --keychain "$KEYCHAIN" --notary-profile "$NOTARY_PROFILE"
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" 2> /dev/null || true

      - name: Sign the new feed
        if: steps.feed.outputs.state == 'new'
        env:
          FEED_SIGNING_KEY: ${{ secrets.FEED_SIGNING_KEY }}
        run: |
          feed="$(tools/package/publish.py merge --version "$VERSION" --keep "$KEEP" --work "$PACKAGE")"
          trap 'rm -f "$RUNNER_TEMP/feed.pem"' EXIT
          (umask 077 && printf '%s\n' "$FEED_SIGNING_KEY" > "$RUNNER_TEMP/feed.pem")
          # Against the app's key too, since apps refuse any other.
          tools/package/feed-signature.sh sign "$feed" "$RUNNER_TEMP/feed.pem" "$FEED_PUBLIC_KEY"
      - name: Publish
        if: steps.feed.outputs.state == 'new'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_RELEASES_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_RELEASES_KEY }}
        run: |
          tools/package/publish.py upload --store "$STORE" --key "$FEED_PUBLIC_KEY" --version "$VERSION" \
            --work "$PACKAGE"
      - name: Check what apps read
        run: |
          tools/package/publish.py check --url "$UPDATE_URL" --key "$FEED_PUBLIC_KEY" --version "$VERSION" \
            --work "$PACKAGE"

  # Built where it runs, with no keys. On the free runners, since only the next Windows build waits. Named per
  # processor, so release-windows can find it.
  build-windows:
    name: build-windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-pc-windows-msvc
            runner: windows-2025-vs2026
          - arch: arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-vs2026-arm
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: release-build-windows-${{ matrix.arch }}-${{ github.ref }}
    env:
      # So the binaries are for this processor whatever the runner's default. build.sh reads it too.
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    timeout-minutes: 90
    defaults:
      run:
        # Git's bash, as on a Mac.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # build.sh counts the commits for the version.
          fetch-depth: 0
          persist-credentials: false
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # Named for the runner, since a target/ fits only its image and checkout path. Not windows.yml's, since this
          # holds release builds.
          key: release-${{ matrix.runner }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: release-${{ matrix.runner }}-
      - name: Build
        id: build
        run: |
          rustup target add "$CARGO_BUILD_TARGET"
          build="$(tools/build.sh --package "$RUNNER_TEMP/binaries")"
          echo "build=$build" >> "$GITHUB_OUTPUT"
      # What packaging on Linux can't run, including the version the hub and the CLI report. Short, since a hub a failed
      # step left running could hold it open.
      - name: Run the built CLI and a hub from the build
        timeout-minutes: 5
        env:
          BUILD: ${{ steps.build.outputs.build }}
        run: tools/package/smoke.sh "$RUNNER_TEMP/binaries" "$BUILD" "$RUNNER_TEMP/smoke"
      - name: Show the hub's log
        if: always()
        run: cat "$RUNNER_TEMP/smoke/home/hub.log" || true
      # On a PR too, since packaging is checked from them.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-binaries-${{ matrix.arch }}
          path: ${{ runner.temp }}/binaries
          if-no-files-found: error
          retention-days: 7
      # Only the dependencies are worth keeping, as in ci.yml, and these are release builds.
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: cargo clean --workspace --release
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # On a PR, packages as release-windows does, to show packaging works. Only a processor whose build failed fails here.
  package-windows:
    needs: build-windows
    if: ${{ !cancelled() && github.ref != 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-binaries-${{ matrix.arch }}
          path: ${{ runner.temp }}/binaries
      - env:
          ARCH: ${{ matrix.arch }}
        run: |
          tools/package/package-windows.sh --arch "$ARCH" --prebuilt "$RUNNER_TEMP/binaries" \
            --out "$RUNNER_TEMP/package"
      - run: ls -l "$RUNNER_TEMP/package/releases"

  # Packages and publishes each processor's binaries to a channel of its own. Each key is only in the steps that use it.
  # Safe to rerun.
  release-windows:
    needs: build-windows
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            channel: win-amd64
          - arch: arm64
            channel: win-arm64
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-publish-windows-${{ matrix.arch }}-${{ github.ref }}
    permissions:
      contents: read
      # To see whether this processor's build was replaced.
      actions: read
    env:
      ARCH: ${{ matrix.arch }}
      CHANNEL: ${{ matrix.channel }}
      STORE: s3://${{ vars.RELEASES_BUCKET }}
      S3_ENDPOINT: ${{ vars.RELEASES_S3_ENDPOINT }}
      S3_REGION: ${{ vars.RELEASES_REGION }}
      # How many releases the feed and the bucket keep.
      KEEP: "10"
    steps:
      # If a newer merge replaced this processor's build, that merge releases it. This job starts anyway, since needs
      # covers the whole matrix, so check the jobs API: a replaced build never got a runner.
      - name: See whether a newer merge's build replaced this one's
        id: own-build
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: build-windows (${{ matrix.arch }})
        run: |
          build="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == env.JOB)] | select(length == 1) | .[0] | "\(.conclusion) \(.runner_id)"')"
          [ -n "$build" ] || { echo "::error::This run has no one job named $JOB"; exit 1; }
          if [ "$build" = "cancelled 0" ]; then
            echo "::notice::A newer merge's build replaced $JOB, so that merge's run releases it"
            echo "replaced=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.own-build.outputs.replaced != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: steps.own-build.outputs.replaced != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-binaries-${{ matrix.arch }}
          path: ${{ runner.temp }}/binaries
      # Outside the checkout, and empty, as publish.py needs.
      - if: steps.own-build.outputs.replaced != 'true'
        run: |
          echo "PACKAGE=$RUNNER_TEMP/package" >> "$GITHUB_ENV"
          version="$(tools/package/package-windows.sh --print-version)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          key="$(cat apps/desktop/src/updates/update-feed.key)"
          echo "FEED_PUBLIC_KEY=$key" >> "$GITHUB_ENV"
          url="$(cat apps/desktop/src/updates/update-feed.url)"
          echo "UPDATE_URL=$url" >> "$GITHUB_ENV"

      # As for the Mac.
      - name: Read the published feed
        id: feed
        if: steps.own-build.outputs.replaced != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_RELEASES_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_RELEASES_KEY }}
        run: |
          state="$(tools/package/publish.py --channel "$CHANNEL" prepare --store "$STORE" --key "$FEED_PUBLIC_KEY" \
            --version "$VERSION" --work "$PACKAGE")"
          echo "$VERSION is $state"
          echo "state=$state" >> "$GITHUB_OUTPUT"
      # vpk makes a delta from the newest full package, which prepare put in releases/.
      - name: Package
        if: steps.feed.outputs.state == 'new'
        run: tools/package/package-windows.sh --arch "$ARCH" --prebuilt "$RUNNER_TEMP/binaries" --out "$PACKAGE"
      - name: Sign the new feed
        if: steps.feed.outputs.state == 'new'
        env:
          FEED_SIGNING_KEY: ${{ secrets.FEED_SIGNING_KEY }}
        run: |
          feed="$(tools/package/publish.py --channel "$CHANNEL" merge --version "$VERSION" --keep "$KEEP" \
            --work "$PACKAGE")"
          # The older channel's feed too, for an app still looking there. See TAKES_OVER in publish.py.
          older="$(tools/package/publish.py --channel "$CHANNEL" bridge --version "$VERSION" --work "$PACKAGE")"
          trap 'rm -f "$RUNNER_TEMP/feed.pem"' EXIT
          (umask 077 && printf '%s\n' "$FEED_SIGNING_KEY" > "$RUNNER_TEMP/feed.pem")
          tools/package/feed-signature.sh sign "$feed" "$RUNNER_TEMP/feed.pem" "$FEED_PUBLIC_KEY"
          if [ -n "$older" ]; then
            tools/package/feed-signature.sh sign "$older" "$RUNNER_TEMP/feed.pem" "$FEED_PUBLIC_KEY"
          fi
      - name: Publish
        if: steps.feed.outputs.state == 'new'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_RELEASES_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_RELEASES_KEY }}
        run: |
          tools/package/publish.py --channel "$CHANNEL" upload --store "$STORE" --key "$FEED_PUBLIC_KEY" \
            --version "$VERSION" --work "$PACKAGE"
      - name: Check what apps read
        if: steps.own-build.outputs.replaced != 'true'
        run: |
          tools/package/publish.py --channel "$CHANNEL" check --url "$UPDATE_URL" --key "$FEED_PUBLIC_KEY" \
            --version "$VERSION" --work "$PACKAGE"

  # Built in Ubuntu 22.04, with no keys, so the app runs on 22.04 and every distro since. On the free runners, the ARM64
  # one with ci.yml's 8-core image. Named per processor, so release-linux can find it.
  build-linux:
    name: build-linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    concurrency:
      group: release-build-linux-${{ matrix.arch }}-${{ github.ref }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      # ci.yml's LINUX_PACKAGES, then what these steps need, with zstd so actions/cache skips gzip.
      PACKAGES: >-
        pkg-config cmake clang libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev
        libfontconfig-dev libfreetype-dev libvulkan-dev libssl-dev libzstd-dev
        build-essential ca-certificates curl git jq
        zstd
      # rustup's installer, pinned by version and checksum.
      RUSTUP_VERSION: 1.29.3
    steps:
      # Before the checkout, which needs git for the history.
      - name: Install what the build needs
        run: |
          apt-get update -qq
          xargs apt-get install -y -qq --no-install-recommends <<< "$PACKAGES"
      - name: Install rustup
        run: |
          case "$(uname -m)" in
            x86_64) sum=b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55 ;;
            aarch64) sum=9f608c142e0e38a78957d0661ba1dfaf0b6fb37184cfaa4b9a0aa57af6184282 ;;
          esac
          init="$RUNNER_TEMP/rustup-init"
          curl -sSf -o "$init" \
            "https://static.rust-lang.org/rustup/archive/$RUSTUP_VERSION/$(uname -m)-unknown-linux-gnu/rustup-init"
          echo "$sum  $init" | sha256sum -c -
          chmod +x "$init"
          "$init" -y -q --default-toolchain none --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # build.sh counts the commits for the version.
          fetch-depth: 0
          persist-credentials: false
      # The container runs as root, and git won't read a repository another user owns until told to.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # Not ci.yml's, since this holds release builds made on 22.04.
          key: release-linux-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: release-linux-${{ matrix.arch }}-
      - name: Build
        id: build
        run: |
          build="$(tools/build.sh --package "$RUNNER_TEMP/binaries")"
          echo "build=$build" >> "$GITHUB_OUTPUT"
      # As for Windows. Short, since a hub a failed step left running could hold it open.
      - name: Run the built CLI and a hub from the build
        timeout-minutes: 5
        env:
          BUILD: ${{ steps.build.outputs.build }}
        run: tools/package/smoke.sh "$RUNNER_TEMP/binaries" "$BUILD" "$RUNNER_TEMP/smoke"
      - name: Show the hub's log
        if: always()
        run: cat "$RUNNER_TEMP/smoke/home/hub.log" || true
      # A tar, since artifacts drop file modes, and on a PR too, for packaging. Its path is the container's, which
      # runner.temp isn't.
      - id: tar
        run: |
          tar -cf "$RUNNER_TEMP/binaries.tar" -C "$RUNNER_TEMP/binaries" .
          echo "path=$RUNNER_TEMP/binaries.tar" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-binaries-${{ matrix.arch }}
          path: ${{ steps.tar.outputs.path }}
          if-no-files-found: error
          retention-days: 7
      # Only the dependencies are worth keeping, as in ci.yml, and these are release builds.
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: cargo clean --workspace --release
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # On a PR, packages as release-linux does, to show packaging works. Only a processor whose build failed fails here.
  package-linux:
    needs: build-linux
    if: ${{ !cancelled() && github.ref != 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LINUX_PACKAGES: squashfs-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-binaries-${{ matrix.arch }}
          path: ${{ runner.temp }}
      - run: .github/install-linux-packages.sh
      - env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir "$RUNNER_TEMP/binaries"
          tar -xf "$RUNNER_TEMP/binaries.tar" -C "$RUNNER_TEMP/binaries"
          tools/package/package-linux.sh --arch "$ARCH" --prebuilt "$RUNNER_TEMP/binaries" --out "$RUNNER_TEMP/package"
      - run: ls -l "$RUNNER_TEMP/package/releases"

  # As release-windows, for Linux.
  release-linux:
    needs: build-linux
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            channel: linux-amd64
          - arch: arm64
            channel: linux-arm64
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-publish-linux-${{ matrix.arch }}-${{ github.ref }}
    permissions:
      contents: read
      # To see whether this processor's build was replaced.
      actions: read
    env:
      ARCH: ${{ matrix.arch }}
      CHANNEL: ${{ matrix.channel }}
      STORE: s3://${{ vars.RELEASES_BUCKET }}
      S3_ENDPOINT: ${{ vars.RELEASES_S3_ENDPOINT }}
      S3_REGION: ${{ vars.RELEASES_REGION }}
      # How many releases the feed and the bucket keep.
      KEEP: "10"
      LINUX_PACKAGES: squashfs-tools
    steps:
      # As for Windows.
      - name: See whether a newer merge's build replaced this one's
        id: own-build
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: build-linux (${{ matrix.arch }})
        run: |
          build="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == env.JOB)] | select(length == 1) | .[0] | "\(.conclusion) \(.runner_id)"')"
          [ -n "$build" ] || { echo "::error::This run has no one job named $JOB"; exit 1; }
          if [ "$build" = "cancelled 0" ]; then
            echo "::notice::A newer merge's build replaced $JOB, so that merge's run releases it"
            echo "replaced=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.own-build.outputs.replaced != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: steps.own-build.outputs.replaced != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-binaries-${{ matrix.arch }}
          path: ${{ runner.temp }}
      - if: steps.own-build.outputs.replaced != 'true'
        run: .github/install-linux-packages.sh
      # Outside the checkout, and empty, as publish.py needs.
      - if: steps.own-build.outputs.replaced != 'true'
        run: |
          echo "PACKAGE=$RUNNER_TEMP/package" >> "$GITHUB_ENV"
          version="$(tools/package/package-linux.sh --print-version)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          key="$(cat apps/desktop/src/updates/update-feed.key)"
          echo "FEED_PUBLIC_KEY=$key" >> "$GITHUB_ENV"
          url="$(cat apps/desktop/src/updates/update-feed.url)"
          echo "UPDATE_URL=$url" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/binaries"
          tar -xf "$RUNNER_TEMP/binaries.tar" -C "$RUNNER_TEMP/binaries"

      # As for the Mac.
      - name: Read the published feed
        id: feed
        if: steps.own-build.outputs.replaced != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_RELEASES_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_RELEASES_KEY }}
        run: |
          state="$(tools/package/publish.py --channel "$CHANNEL" prepare --store "$STORE" --key "$FEED_PUBLIC_KEY" \
            --version "$VERSION" --work "$PACKAGE")"
          echo "$VERSION is $state"
          echo "state=$state" >> "$GITHUB_OUTPUT"
      # vpk makes a delta from the newest full package, which prepare put in releases/.
      - name: Package
        if: steps.feed.outputs.state == 'new'
        run: tools/package/package-linux.sh --arch "$ARCH" --prebuilt "$RUNNER_TEMP/binaries" --out "$PACKAGE"
      - name: Sign the new feed
        if: steps.feed.outputs.state == 'new'
        env:
          FEED_SIGNING_KEY: ${{ secrets.FEED_SIGNING_KEY }}
        run: |
          feed="$(tools/package/publish.py --channel "$CHANNEL" merge --version "$VERSION" --keep "$KEEP" \
            --work "$PACKAGE")"
          trap 'rm -f "$RUNNER_TEMP/feed.pem"' EXIT
          (umask 077 && printf '%s\n' "$FEED_SIGNING_KEY" > "$RUNNER_TEMP/feed.pem")
          tools/package/feed-signature.sh sign "$feed" "$RUNNER_TEMP/feed.pem" "$FEED_PUBLIC_KEY"
      - name: Publish
        if: steps.feed.outputs.state == 'new'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_RELEASES_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_RELEASES_KEY }}
        run: |
          tools/package/publish.py --channel "$CHANNEL" upload --store "$STORE" --key "$FEED_PUBLIC_KEY" \
            --version "$VERSION" --work "$PACKAGE"
      - name: Check what apps read
        if: steps.own-build.outputs.replaced != 'true'
        run: |
          tools/package/publish.py --channel "$CHANNEL" check --url "$UPDATE_URL" --key "$FEED_PUBLIC_KEY" \
            --version "$VERSION" --work "$PACKAGE"

# Publishes the site to GitHub Pages when it changes on main: site/, and the guide in docs/guide as its /docs/ pages.
# See site/README.md and tools/guide/README.md.
#
# The address is the Pages custom domain and this masked secret, so the site can move without editing this file:
#   SITE_URL   The site's address, for the link-preview tags, which are left out without it.
name: Site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - tools/site/**
      - docs/guide/**
      # The guide's pictures are the app's own screens.
      - docs/spec/screens/**
      - tools/guide/**
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

# One at a time and never cut short.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    # No `url`, since it would show the address on every run.
    environment: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Put the site together
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -euo pipefail
          tools/site/assemble.py "$RUNNER_TEMP/site" ${SITE_URL:+"$SITE_URL"}
          # The guide, which builds with nothing but Rust, as rust-toolchain.toml pins it. CI's `guide` job has built
          # it for every change that could break it, so this fails only if what's on main does.
          cargo run --locked -p guide -- "$RUNNER_TEMP/site/docs"
          # The github-pages artifact, by hand, since actions/upload-pages-artifact calls an action the repo can't pin.
          tar --dereference --hard-dereference -cf "$RUNNER_TEMP/artifact.tar" -C "$RUNNER_TEMP/site" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 1
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

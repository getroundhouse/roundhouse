# A probe of #1921, run by hand from this branch. Not for main.
name: Mac
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-ci:
    runs-on: runs-on=${{ github.run_id }}/runner=arm64-16-gen8
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: uname -a; sysctl net.ipv4.tcp_wmem net.ipv4.tcp_rmem net.core.wmem_max net.core.rmem_max; for i in 1 2 3; do python3 -I .github/probe/smallrcv.py; done
  linux-github:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: uname -a; sysctl net.ipv4.tcp_wmem net.ipv4.tcp_rmem net.core.wmem_max net.core.rmem_max; for i in 1 2 3; do python3 -I .github/probe/smallrcv.py; done
  mac:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: for i in 1 2 3; do python3 -I .github/probe/smallrcv.py; done

# A probe of the Mac runner's loopback buffers, run by hand from this branch. Not for main.
name: Mac
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      matrix:
        part: [1, 2, 3]
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sw_vers; sysctl hw.ncpu hw.memsize; python3 -I .github/probe/sockbuf.py

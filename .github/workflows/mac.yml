# What only a Mac catches, mostly after a dependency changes. The queue doesn't wait for it, and the full checks also
# run on a Mac before each push.
name: Mac

on:
  pull_request:
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - rust-toolchain.toml
      - .cargo/**
      - .github/workflows/mac.yml
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - rust-toolchain.toml
      - .cargo/**
      - .github/workflows/mac.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      # The Zig that builds Ghostty's terminal core, which its build script runs. Its own cache is off, since it would
      # hold only the Zig packages Ghostty fetches, and the cache below holds Ghostty's source and build, in target/.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          # renovate: datasource=forgejo-tags depName=ziglang/zig registryUrl=https://codeberg.org
          version: 0.17.1
          use-cache: false
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: mac-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: mac-
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The gallery's images match the Mac that approved them, pixel for pixel.
      - run: cargo test --workspace --locked -- --skip 'gallery::'
      # Only the dependencies are worth keeping, as in ci.yml.
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: cargo clean --workspace
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}

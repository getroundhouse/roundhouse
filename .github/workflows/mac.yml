# What only a Mac catches, mostly after a dependency changes, the copy of gpui-kit included. The queue doesn't wait
# for it, and the full checks also run on a Mac before each push.
name: Mac

on:
  pull_request:
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - rust-toolchain.toml
      - .cargo/**
      - third_party/**
      - .github/workflows/mac.yml
      - .github/actions/zig/**
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - rust-toolchain.toml
      - .cargo/**
      - third_party/**
      - .github/workflows/mac.yml
      - .github/actions/zig/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Probe: what the Mac cache holds, by kind, raw and compressed as actions/cache compresses it.
  mac:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: mac-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: mac-
      - run: python3 .github/cache-probe.py "$RUNNER_TEMP/kinds"
      - run: |
          cd "$RUNNER_TEMP/kinds"
          for list in *.txt; do
            start=$(date +%s)
            bytes=$(sed '/^$/d' "$list" | gtar -cf - -P -T - 2>/dev/null | zstd -T0 --long=30 -q -c | wc -c)
            echo "$(( bytes / 1000000 )) MB compressed, $(( $(date +%s) - start ))s to pack: ${list%.txt}"
          done | sort -rn

# What only a Mac catches, mostly after a dependency changes. The queue doesn't wait for it, and the full checks also
# run on a Mac before each push.
name: Mac

on:
  pull_request:
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - rust-toolchain.toml
      - .cargo/**
      - .github/workflows/mac.yml
      - .github/actions/zig/**
      - .github/only-descriptions-changed.py
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - rust-toolchain.toml
      - .cargo/**
      - .github/workflows/mac.yml
      - .github/actions/zig/**
      - .github/only-descriptions-changed.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Skips the Mac when the only files above that changed are Cargo.toml files that differ from the base's only in a
  # package's description, comments or layout, since none of those builds differently on a Mac. The crates'
  # descriptions grow with what each does, so many PRs change nothing else here.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A PR's base is its base branch, as in ci.yml, and a push's is where main was before it. A dispatch has neither,
      # and an error runs the Mac.
      - id: diff
        env:
          BASE: ${{ github.base_ref || github.event.before }}
        run: |
          run=true
          if [ -n "$BASE" ] && git fetch --quiet --depth=1 origin "$BASE" &&
            git diff --quiet FETCH_HEAD HEAD -- Cargo.lock rust-toolchain.toml .cargo .github/workflows/mac.yml \
              .github/actions/zig .github/only-descriptions-changed.py &&
            python3 .github/only-descriptions-changed.py FETCH_HEAD; then
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  mac:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      # The Zig that builds Ghostty's terminal core, and Zig's global cache, which the last step saves.
      - id: zig
        uses: ./.github/actions/zig
        with:
          cache-name: mac
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: mac-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: mac-
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The gallery's images match the Mac that approved them, pixel for pixel.
      - run: cargo test --workspace --locked -- --skip 'gallery::'
      # Only the dependencies are worth keeping, as in ci.yml.
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: cargo clean --workspace
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}
      # Zig's global cache, once Zig has built something, which it hasn't when target/ held Ghostty's build. What it
      # built is then listed in h/.
      - if: >-
          github.ref == 'refs/heads/main' && steps.zig.outputs.cache-hit != 'true' &&
          hashFiles('.zig-cache/h/**') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: ${{ steps.zig.outputs.cache-primary-key }}

# What only a Mac catches, mostly after a dependency changes, the copy of gpui-kit included. The queue doesn't wait
# for it, and the full checks also run on a Mac before each push.
name: macOS

on:
  pull_request:
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - rust-toolchain.toml
      - .cargo/**
      - third_party/**
      - .github/workflows/macos.yml
      - .github/actions/zig/**
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - rust-toolchain.toml
      - .cargo/**
      - third_party/**
      - .github/workflows/macos.yml
      - .github/actions/zig/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The test runner, which Renovate raises, as in ci.yml.
  # renovate: datasource=crate depName=cargo-nextest
  NEXTEST_VERSION: 0.9.151

jobs:
  # Clippy on a runner of its own, with a cache of what only it builds, so the tests' runners restore none of that and a
  # lint fails within minutes. Mac runners cost nothing on a public repo.
  lint:
    # Apart from ci.yml's lint, which is named the same.
    name: macos lint
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Zig that builds Ghostty's terminal core. The tests' first runner saves Zig's global cache.
      - uses: ./.github/actions/zig
        with:
          cache-name: test-macos-arm64-macos-26
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # Named as ci.yml's are.
          key: lint-macos-arm64-macos-26-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          # As in ci.yml, main rebuilds from nothing when the key changes, so a cache holds one lockfile's build. PRs
          # take any.
          restore-keys: ${{ github.ref != 'refs/heads/main' && 'lint-macos-arm64-macos-26-' || '' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Only the dependencies are worth keeping, as in ci.yml.
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: cargo clean --workspace
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # A quarter of the tests on each of four runners, since the tests take all of a runner's 3 cores: on one, they ran for
  # 9 to 15 minutes, and on three, for 2.5 to 5 each. Each runner compiles them itself. The first also runs the doc tests
  # and saves the caches.
  macos:
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      # The Zig that builds Ghostty's terminal core, and Zig's global cache, which the last step saves.
      - id: zig
        uses: ./.github/actions/zig
        with:
          cache-name: test-macos-arm64-macos-26
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # Named apart from lint's, since a prefix of one would restore the other.
          key: test-macos-arm64-macos-26-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          # As in ci.yml, main rebuilds from nothing when the key changes, so a cache holds one lockfile's build. Built
          # on the last cache, each kept the builds of every lockfile before it, and two thirds of what it held,
          # compressed, was output no current build used. PRs take any.
          restore-keys: ${{ github.ref != 'refs/heads/main' && 'test-macos-arm64-macos-26-' || '' }}
      # The gallery's images match the Mac that approved them, pixel for pixel.
      - run: >-
          cargo nextest run --profile mac --workspace --locked --partition slice:${{ matrix.part }}/4
          -E 'not test(/^gallery::/)'
      # nextest skips doc tests, as in ci.yml.
      - if: matrix.part == 1
        run: cargo test --workspace --doc --locked
      # Only the dependencies are worth keeping, as in ci.yml.
      - if: matrix.part == 1 && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: cargo clean --workspace
      - if: matrix.part == 1 && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}
      # Zig's global cache, once Zig has built something, which it hasn't when target/ held Ghostty's build. What it
      # built is then listed in h/.
      - if: >-
          matrix.part == 1 && github.ref == 'refs/heads/main' && steps.zig.outputs.cache-hit != 'true' &&
          hashFiles('.zig-cache/h/**') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: ${{ steps.zig.outputs.cache-primary-key }}

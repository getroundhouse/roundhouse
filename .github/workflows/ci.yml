# The full checks from AGENTS.md, with the tests run by nextest, and the tests of the scripts that publish releases, for
# every PR and the merge queue. They run on Linux, where everything passes but the gallery: the window tests use GPUI's
# test platform, which draws nothing, and the gallery, whose images are exact to the Mac that approved them, is compiled
# only on macOS. mac.yml covers what only a Mac catches. A change to nothing but Markdown skips them.
name: CI

on:
  pull_request:
  merge_group:
  # Only main saves caches, so PRs start warm. The queue has already tested what lands, so main only runs when the
  # cache key could change.
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/ci.yml

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Smaller caches and faster links. A panic still gets line numbers.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # What GPUI's Linux crates build against. Verified on 2026-11-08 in Docker, not minimized.
  LINUX_PACKAGES: >-
    pkg-config cmake clang libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev
    libfontconfig-dev libfreetype-dev libvulkan-dev libssl-dev libzstd-dev

# The ruleset on main requires only `checks`, so jobs can be added, renamed or skipped without changing it. A paths
# filter can't do the skipping: GitHub leaves a required check pending forever when its workflow doesn't run. The repo
# also only runs actions pinned to a full commit, as these are.
jobs:
  # Whether the checks run. They don't when nothing but Markdown differs from the branch being merged into, which in the
  # queue includes the PRs ahead, or when the queue would check a tree that a PR's run has already passed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # To find that PR's run, by the artifact `checks` keeps.
      actions: read
    outputs:
      run: ${{ steps.diff.outputs.run }}
      tree: ${{ steps.diff.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A push to main has no base, and an error runs the checks, so a push always does.
      #
      # A PR that enters the queue with nothing ahead of it, onto the main its own run merged onto, makes the very tree
      # that run checked, so checking it again only holds up the merge. Only runs from this repo's branches count, since
      # a fork's run could keep an artifact by any name.
      - id: diff
        env:
          BASE: ${{ github.base_ref || github.event.merge_group.base_ref }}
          GH_TOKEN: ${{ github.token }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          run=true
          tree=$(git rev-parse 'HEAD^{tree}')
          if [ -n "$BASE" ] && git fetch --quiet --depth=1 origin "$BASE" &&
            git diff --quiet FETCH_HEAD HEAD -- ':(exclude)*.md'; then
            run=false
          # On an error, gh prints the error's body and fails, so `passed` must be a run's ID too.
          elif [ "$GITHUB_EVENT_NAME" = merge_group ] &&
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ci-passed-$tree" --jq \
              "[.artifacts[] | select(.workflow_run.head_repository_id == $REPO_ID and (.expired | not))][0].workflow_run.id // empty") &&
            [[ "$passed" =~ ^[0-9]+$ ]]; then
            run=false
            echo "::notice::$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$passed passed this tree on its PR"
          fi
          { echo "run=$run"; echo "tree=$tree"; } >> "$GITHUB_OUTPUT"

  # The org's 8-core arm64 runner, since a cold `cargo test --workspace` took over 20 minutes on 2 cores.
  lint:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest-arm64-8cores
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: .github/install-linux-packages.sh
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: linux-lint-deps-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          # When the key changes, main builds from nothing, so a cache holds what one lockfile builds rather than
          # what every lockfile before it built too. A PR starts from any cache, since most of it still fits.
          restore-keys: ${{ github.ref != 'refs/heads/main' && 'linux-lint-deps-' || '' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The product's code alone, as it ships, since the `testing` features the tests turn on can hide an import or an
      # item only the tests use.
      - run: cargo clippy --workspace --locked -- -D warnings
      # Only the dependencies are worth keeping. A checkout leaves our own crates' sources newer than anything cached,
      # so they build again on every run.
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: cargo clean --workspace
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}

  test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest-arm64-8cores
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: .github/install-linux-packages.sh
      # The tests make commits.
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      # A pinned version, moved by hand like the toolchain.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # As in lint. Our own crates' test binaries each link all of GPUI, so they're over half of what's built.
          key: linux-test-deps-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && 'linux-test-deps-' || '' }}
      # nextest runs every test binary's tests in one pool, where `cargo test` runs one binary after another. It skips
      # doc tests, so they run after it. .config/nextest.toml says how.
      - run: cargo nextest run --profile ci --workspace --locked
      - run: cargo test --workspace --doc --locked
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: cargo clean --workspace
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # release.yml publishes only after a merge, and nothing there can block one, so a PR that breaks publish.py or
  # feed-signature.sh fails here instead. Ubuntu's Python and OpenSSL 3 are all they need.
  publish:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s tools/package -v

  # The one check the ruleset requires. It fails if any job failed or was cancelled, `changes` included, and passes
  # if the rest passed or were skipped. It runs even when they fail, since a skipped job would count as passing.
  checks:
    needs: [changes, lint, test, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      # What `changes` looks for in the queue: an artifact named for a tree that every check ran on and passed.
      - id: passed
        if: >-
          github.event_name == 'pull_request' && needs.lint.result == 'success' && needs.test.result == 'success' &&
          needs.publish.result == 'success'
        run: echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/passed"
      # Without it the queue only checks the tree again, so failing to keep it doesn't fail the PR.
      - if: steps.passed.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-passed-${{ needs.changes.outputs.tree }}
          path: ${{ runner.temp }}/passed
          if-no-files-found: error
          retention-days: 7
          # A re-run keeps it again.
          overwrite: true

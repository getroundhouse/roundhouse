# AGENTS.md's full checks and publish.py's tests, on Linux, for every PR and the queue. The gallery compiles only on
# macOS, and mac.yml covers the Mac. Changes to only Markdown and the site skip them, and a change to what the guide
# is made of builds the guide, whatever else it changes.
name: CI

on:
  pull_request:
  merge_group:
  # Only main saves caches. The queue has tested what lands, so main runs only when the cache key could change.
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - rust-toolchain.toml
      - .github/workflows/ci.yml

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Smaller caches and faster links. A panic still gets line numbers.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # The test runner, which Renovate raises.
  # renovate: datasource=crate depName=cargo-nextest
  NEXTEST_VERSION: 0.9.151
  # What GPUI's Linux crates build against. Verified on 2026-11-08 in Docker, not minimized.
  LINUX_PACKAGES: >-
    pkg-config cmake clang libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev
    libfontconfig-dev libfreetype-dev libvulkan-dev libssl-dev libzstd-dev

# The ruleset requires only `checks`. `changes` does the skipping, since a required check whose workflow never runs
# stays pending. Actions are pinned to full commits.
jobs:
  # Skips the checks when only Markdown and the site differ from the base, or when the queue would check a tree a PR's
  # run already passed. Says apart whether to build the guide, which is Markdown the checks don't read.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # To find that PR's run.
      actions: read
    outputs:
      run: ${{ steps.diff.outputs.run }}
      guide: ${{ steps.diff.outputs.guide }}
      tree: ${{ steps.diff.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A push has no base, and an error runs the checks. A PR entering the queue first gets the tree its own run
      # passed. Only this repo's runs count, since a fork's could fake the artifact.
      - id: diff
        env:
          BASE: ${{ github.base_ref || github.event.merge_group.base_ref }}
          GH_TOKEN: ${{ github.token }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          run=true
          guide=true
          tree=$(git rev-parse 'HEAD^{tree}')
          # Checking out fetched too, so only a fetch of the base that worked makes FETCH_HEAD the base.
          based=false
          if [ -n "$BASE" ] && git fetch --quiet --depth=1 origin "$BASE"; then based=true; fi
          # What the guide is made of: its pages, the screens and the README they show and link to, the tool, and what
          # the tool is built with. A page can link to any file, so a change that takes one away, or renames it, builds
          # the guide too.
          if $based && git diff --quiet FETCH_HEAD HEAD -- \
            docs/guide docs/spec/screens README.md tools/guide Cargo.lock rust-toolchain.toml &&
            git diff --quiet --no-renames --diff-filter=D FETCH_HEAD HEAD; then
            guide=false
          fi
          if $based &&
            git diff --quiet FETCH_HEAD HEAD -- ':(exclude)*.md' ':(exclude)site' ':(exclude)tools/site'; then
            run=false
          # gh prints an error's body, so check `passed` is a run ID. A run that passed built the guide if it had to.
          elif [ "$GITHUB_EVENT_NAME" = merge_group ] &&
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ci-passed-$tree" --jq \
              "[.artifacts[] | select(.workflow_run.head_repository_id == $REPO_ID and (.expired | not))][0].workflow_run.id // empty") &&
            [[ "$passed" =~ ^[0-9]+$ ]]; then
            run=false
            guide=false
            echo "::notice::$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$passed passed this tree on its PR"
          fi
          { echo "run=$run"; echo "guide=$guide"; echo "tree=$tree"; } >> "$GITHUB_OUTPUT"

  # The free arm64 runner, with the tests' image so the cache fits. It still finishes before them.
  lint:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: .github/install-linux-packages.sh
      # The Zig that builds Ghostty's terminal core, which its build script runs. Its own cache is off, since it would
      # hold only the Zig packages Ghostty fetches, and the cache below holds Ghostty's source and build, in target/.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          # renovate: datasource=forgejo-tags depName=ziglang/zig registryUrl=https://codeberg.org
          version: 0.17.1
          use-cache: false
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # Every Cargo.toml too, since a profile or a dependency's features change what's built without changing
          # Cargo.lock.
          key: linux-lint-deps-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          # Main rebuilds from nothing when the key changes, so a cache holds one lockfile's build. PRs take any.
          restore-keys: ${{ github.ref != 'refs/heads/main' && 'linux-lint-deps-' || '' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # As shipped, since the tests' `testing` features can hide what only tests use.
      - run: cargo clippy --workspace --locked -- -D warnings
      # Only the binaries may read the build stamp, so each release compiles again only what its commit changed.
      - run: tools/check-stamp.sh
      # Keep only the dependencies, since our crates rebuild after every checkout.
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: cargo clean --workspace
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # The billed 16-core runner, since PRs and the queue wait for the tests, and nextest runs one per core. A cold run took
  # over 20 minutes on 2 cores.
  test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest-arm64-16cores
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: .github/install-linux-packages.sh
      # The Zig that builds Ghostty's terminal core, which its build script runs. Its own cache is off, since it would
      # hold only the Zig packages Ghostty fetches, and the cache below holds Ghostty's source and build, in target/.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          # renovate: datasource=forgejo-tags depName=ziglang/zig registryUrl=https://codeberg.org
          version: 0.17.1
          use-cache: false
      # The tests make commits.
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # As in lint. Our test binaries each link GPUI, so they're over half the build.
          key: linux-test-deps-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && 'linux-test-deps-' || '' }}
      # One pool for every binary's tests. It skips doc tests, so they run after.
      - run: cargo nextest run --profile ci --workspace --locked
      - run: cargo test --workspace --doc --locked
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: cargo clean --workspace
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # release.yml can't block a merge, so its scripts' tests run here.
  publish:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s tools/package -v

  # Builds the guide, docs/guide, as the site publishes it, which refuses a link, a heading or a picture that isn't
  # there. No test does, since a change to only the guide's Markdown runs none, as tools/guide/README.md says. It
  # builds nothing but the tool, so it needs neither Zig nor GPUI's packages.
  guide:
    needs: changes
    # Not for a push to main, which only saves the other jobs' caches: the queue built what landed.
    if: needs.changes.outputs.guide == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo run --locked -p guide -- "$RUNNER_TEMP/docs"

  # The one required check. It fails if any job failed or was cancelled, and passes if the rest passed or were skipped.
  checks:
    needs: [changes, lint, test, publish, guide]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      # What `changes` looks for: an artifact named for a tree that passed.
      - id: passed
        if: >-
          github.event_name == 'pull_request' && needs.lint.result == 'success' && needs.test.result == 'success' &&
          needs.publish.result == 'success'
        run: echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/passed"
      # Losing it only costs the queue a recheck.
      - if: steps.passed.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-passed-${{ needs.changes.outputs.tree }}
          path: ${{ runner.temp }}/passed
          if-no-files-found: error
          retention-days: 7
          # A re-run keeps it again.
          overwrite: true

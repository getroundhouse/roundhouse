# What only Windows catches: code that no longer compiles there, and a hub a client can't start, reach or stop. It
# doesn't block merges.
name: Windows

on:
  pull_request:
    paths:
      - "**.rs"
      - Cargo.lock
      - "**/Cargo.toml"
      - rust-toolchain.toml
      - .cargo/**
      - .github/workflows/windows.yml
  # Only main saves caches, so PRs start warm.
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - rust-toolchain.toml
      - .github/workflows/windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # The free runner, since nothing waits for it. The lint took 14 minutes cold.
  windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    defaults:
      run:
        # Git's bash, as in the other workflows.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Zig that builds Ghostty's terminal core, which its build script runs. Its own cache is off, since it would
      # hold only the Zig packages Ghostty fetches, and the cache below holds Ghostty's source and build, in target/.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          # renovate: datasource=forgejo-tags depName=ziglang/zig registryUrl=https://codeberg.org
          version: 0.17.1
          use-cache: false
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # Named for the runner, since a target/ fits only its image and checkout path.
          key: windows-2025-vs2026-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml') }}
          restore-keys: windows-2025-vs2026-
      # Not --all-targets, since most tests only build on Unix.
      - run: cargo clippy --workspace --locked -- -D warnings
      # Tests of what Windows does differently below the hub, and of Ghostty's terminal core, built by Zig for MSVC,
      # which only a Windows machine can build.
      - run: cargo test --locked -p process -p protocol -p terminal-state
      - run: cargo build --locked -p daemon -p cli --bins
      # Short, since a hub a failed step left running could hold it open.
      - name: Run the CLI and a hub it starts
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          export ROUNDHOUSE_HOME="$RUNNER_TEMP/smoke/home" ROUNDHOUSE_WORKSPACES="$RUNNER_TEMP/smoke/workspaces"
          cli=target/debug/roundhouse.exe
          # Whatever fails, no hub is left behind.
          trap '"$cli" hub stop > /dev/null 2>&1 || true' EXIT
          # Needs a hub, so it starts one.
          "$cli" repo list
          "$cli" hub status | tee "$RUNNER_TEMP/smoke/status.txt"
          grep -q "started on demand" "$RUNNER_TEMP/smoke/status.txt"
          "$cli" hub stop
          # A hub can take a moment to exit after replying, so ask until it has.
          for _ in $(seq 50); do
            "$cli" hub status > "$RUNNER_TEMP/smoke/stopped.txt" 2>&1 || true
            if grep -q "no hub is running" "$RUNNER_TEMP/smoke/stopped.txt"; then break; fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/smoke/stopped.txt"
          grep -q "no hub is running" "$RUNNER_TEMP/smoke/stopped.txt"
      - name: Show the hub's log
        if: always()
        run: cat "$RUNNER_TEMP/smoke/home/hub.log" || true
      # Only the dependencies are worth keeping, as in ci.yml.
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: cargo clean --workspace
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}

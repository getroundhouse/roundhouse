[package]
name = "transcript"
description = "A session's history and live output, on gpui-kit's list and text views."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# What only tests read: where the scrollbar's thumb is, and how long a new question ignores keys, which a test can wait
# out. And look's, for setting off a scroll by a test's clock.
testing = ["look/testing"]

[dependencies]
protocol.workspace = true
client-core.workspace = true
gpui-kit.workspace = true
# Reads an attached image's size before it's drawn, so its row doesn't change height. GPUI already builds these.
image = { workspace = true, features = ["gif", "jpeg", "png", "webp"] }
look.workspace = true
# Finds the images written one after another in the agent's text or a prompt's, to draw each at its own width, as the
# text view reads it.
markdown.workspace = true
# Holds the images the agent's text points to, for the text view, which takes only what can be shared across threads.
parking_lot.workspace = true
serde_json.workspace = true
similar.workspace = true

[dev-dependencies]
proptest.workspace = true
transcript = { workspace = true, features = ["testing"] }
# For a test of what the kit's text view reads at once, which the transcript keeps text views by.
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

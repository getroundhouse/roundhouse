[package]
name = "transcript"
description = "A session's history and live output, on gpui-kit's list and text views."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# What only tests read: where the scrollbar's thumb is.
testing = []

[dependencies]
protocol.workspace = true
client-core.workspace = true
gpui-kit.workspace = true
# Reads an attached image's size before it's drawn, so its row doesn't change height. GPUI already builds these.
image = { workspace = true, features = ["gif", "jpeg", "png", "webp"] }
look.workspace = true
# Holds the images the agent's text points to, for the text view, which takes only what can be shared across threads.
parking_lot.workspace = true
percent-encoding.workspace = true
serde_json.workspace = true
similar.workspace = true

[dev-dependencies]
transcript = { workspace = true, features = ["testing"] }

[lints]
workspace = true

[package]
name = "transcript"
description = "A session's history and live output, in a list of its own, on gpui-kit's Markdown blocks."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# What only tests read: where the scrollbar's thumb is, and how long a new question ignores keys, which a test can wait
# out. And look's, for setting off a scroll by a test's clock.
testing = ["client-core/testing", "look/testing", "dictation-ui/testing"]

[dependencies]
protocol.workspace = true
client-core.workspace = true
gpui-kit.workspace = true
# Reads an attached image's size before it's drawn, so its row doesn't change height. GPUI already builds these.
image = { workspace = true, features = ["gif", "jpeg", "png", "webp"] }
look.workspace = true
dictation-ui.workspace = true
# Finds the images written one after another in the agent's text or a prompt's, to draw each at its own width, as the
# kit parses it.
markdown.workspace = true
# Holds the images the agent's text points to, for the kit's drawing of a text, which takes only what can be shared
# across threads.
parking_lot.workspace = true
# Draws a Mermaid diagram the agent writes, measuring its words with the font GPUI draws them in.
merman = { workspace = true, features = [
    "svg",
    "diagram-class",
    "diagram-er",
    "diagram-flowchart",
    "diagram-gantt",
    "diagram-git-graph",
    "diagram-journey",
    "diagram-mindmap",
    "diagram-pie",
    "diagram-sequence",
    "diagram-state",
    "diagram-timeline",
] }
rustybuzz.workspace = true
serde_json.workspace = true
similar.workspace = true
# Moves an end of what's selected by a character as a person sees one, such as a letter with its accent.
unicode-segmentation.workspace = true
# Reads a drawing a text points to before GPUI draws it, so it shows no file it names by its path.
usvg.workspace = true

[dev-dependencies]
proptest.workspace = true
protocol = { workspace = true, features = ["testing"] }
# For the files tests make, such as a picture a drawing names, and the socket of a hub stood in for, which a view that
# reads from a hub is given.
tempfile.workspace = true
transcript = { workspace = true, features = ["testing"] }
# For the tests that need an app, such as those of where a text is drawn and what's selected of it.
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

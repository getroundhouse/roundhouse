[package]
name = "local-hub"
description = "Starting a hub on this machine when there's none, for the desktop app and the CLI."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Starting a hub in an environment a test gives it, and keeping each hub started for the test to stop.
testing = ["dep:parking_lot"]

[dependencies]
client-core.workspace = true
logging.workspace = true
parking_lot = { workspace = true, optional = true }
private-files.workspace = true
process.workspace = true
protocol.workspace = true

[dev-dependencies]
# What the `testing` feature brings in, which the tests have without it.
parking_lot.workspace = true
client-core = { workspace = true, features = ["testing"] }
libc.workspace = true
protocol = { workspace = true, features = ["testing"] }
tempfile.workspace = true
waiting.workspace = true

[lints]
workspace = true

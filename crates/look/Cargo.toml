[package]
name = "look"
description = "How the app looks: every colour it draws with, every kind of text it sets and every corner it rounds, by what each is for, the width of an edge, the theme made from them, code's colours, the words that changed in a diff's lines, the status mark, the app icon, and the parts of the window tests find."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# What only tests use: holding the marks and the time still for pictures, setting off a scroll by a test's clock, and
# the lists of the colours, the kinds of text and the corners, for the sheets that show them.
testing = []

[dependencies]
chrono.workspace = true
gpui-kit.workspace = true
serde_json.workspace = true
# Compares the words of a diff's lines, to mark those that changed.
similar.workspace = true
# The kit's highlighter is private, so code is highlighted with the same two crates directly. Oniguruma took
# highlighting a large diff from 12.2 s of CPU to 2.6 s.
syntect = { workspace = true, features = ["default-fancy", "regex-onig"] }
two-face = { workspace = true, features = ["syntect-onig"] }

[dev-dependencies]
# For a test that installs the theme in an app and reads it back.
gpui-kit = { workspace = true, features = ["test-support"] }
proptest.workspace = true

[lints]
workspace = true

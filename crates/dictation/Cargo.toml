[package]
name = "dictation"
description = "Hearing speech and turning it into text on this device: recordings, cutting them at their pauses, and the engines that hear them. No UI and no async runtime."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# What only tests use: an engine that stands in for the model, and audio a test feeds a recording itself.
testing = []

[dependencies]
flume.workspace = true
# Nemotron's files, which say what to download.
models.workspace = true
parking_lot.workspace = true
# The Fourier transform the model's features are made with.
realfft.workspace = true
serde_json.workspace = true
# The microphone a recording hears, and quieting what's playing while it does.
sound.workspace = true
thiserror.workspace = true

# The model, on Core ML.
[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-core-ml.workspace = true
objc2-foundation = { workspace = true, features = ["NSDictionary", "NSError", "NSProcessInfo", "NSURL", "NSValue"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true

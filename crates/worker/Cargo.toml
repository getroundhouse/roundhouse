[package]
name = "worker"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# What only tests use: a worker that says it's another build, as one an earlier hub left would, and shorter timers.
testing = ["protocol/testing"]

[dependencies]
process.workspace = true
parking_lot.workspace = true
private-files.workspace = true
protocol.workspace = true
agents.workspace = true
base64.workspace = true
jiff.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1"] }
markdown.workspace = true
memchr.workspace = true
notify.workspace = true
percent-encoding.workspace = true
portable-pty.workspace = true
toml.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1_smol.workspace = true
terminal-state.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-service.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v5"] }

[dev-dependencies]
agents = { workspace = true, features = ["testing"] }
anyhow.workspace = true
worker = { workspace = true, features = ["testing"] }
process = { workspace = true, features = ["testing"] }
proptest.workspace = true
protocol = { workspace = true, features = ["testing"] }
tempfile.workspace = true
# A paused clock, for the waits watches settle with.
tokio = { workspace = true, features = ["test-util"] }
logging = { workspace = true, features = ["testing"] }
waiting.workspace = true

[lints]
workspace = true

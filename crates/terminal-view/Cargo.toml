[package]
name = "terminal-view"
description = "A workspace's terminal in a GPUI view: what client-core holds of what its worker shows, painted as a grid of glyphs, the keys typed into it, and what's selected in it with the pointer."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# What only tests read: the text of each row the view last drew, whether it shows a selection, and the size of a cell.
testing = []

[dependencies]
client-core.workspace = true
gpui-kit.workspace = true
look.workspace = true
protocol.workspace = true

[dev-dependencies]
# A window to measure cells in.
gpui-kit = { workspace = true, features = ["test-support"] }
# Whether a key is sent as Ghostty encodes it.
terminal-state.workspace = true

[lints]
workspace = true

[package]
name = "conversation"
description = "Conversation mode's voice on this device, for every client: client-core's reading out, read with Phonon through the speakers, and Phonon's files fetched the first time. No UI and no async runtime."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
client-core.workspace = true
flume.workspace = true
models = { workspace = true, features = ["download"] }
parking_lot.workspace = true
phonon.workspace = true
protocol.workspace = true
speaking.workspace = true

[dev-dependencies]
client-core = { workspace = true, features = ["testing"] }
fetching = { workspace = true, features = ["testing"] }
protocol = { workspace = true, features = ["testing"] }
tempfile.workspace = true
waiting.workspace = true

[lints]
workspace = true

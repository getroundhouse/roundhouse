testing = []

[dependencies]
async-trait.workspace = true
fastrand.workspace = true
parking_lot.workspace = true
private-files.workspace = true
process.workspace = true
protocol.workspace = true
providers.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
process = { workspace = true, features = ["testing"] }
proptest.workspace = true
protocol = { workspace = true, features = ["testing"] }
tempfile.workspace = true
# For tests that pause time, so a timeout passes without being waited for.
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true

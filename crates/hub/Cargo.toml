[package]
name = "hub"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# What tests of the hub from outside it need, such as the names it picks from, shorter timers, and a stand-in for
# GitHub.
testing = []

[dependencies]
base64.workspace = true
rcgen.workspace = true
ring.workspace = true
socket2.workspace = true
tokio-rustls.workspace = true
webpki.workspace = true
async-trait.workspace = true
chrono.workspace = true
fastrand.workspace = true
http.workspace = true
octocrab.workspace = true
parking_lot.workspace = true
private-files.workspace = true
process.workspace = true
protocol.workspace = true
providers.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
client-core = { workspace = true, features = ["testing"] }
hub = { workspace = true, features = ["testing"] }
process = { workspace = true, features = ["testing"] }
proptest.workspace = true
protocol = { workspace = true, features = ["testing"] }
tempfile.workspace = true
# For tests that pause time, so a timeout passes without being waited for.
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_WindowsProgramming"] }

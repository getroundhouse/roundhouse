[package]
name = "hub"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# What tests of the hub from outside it need, such as the names it picks from, shorter timers, a stand-in for GitHub,
# and a database every migration has run on, which is kept as tests of processes keep what they share.
testing = ["github/testing", "process/testing"]

[dependencies]
base64.workspace = true
rcgen.workspace = true
ring.workspace = true
socket2.workspace = true
tokio-rustls.workspace = true
webpki.workspace = true
async-trait.workspace = true
fastrand.workspace = true
fetching.workspace = true
# Reads the archive of the release an update goes to.
flate2.workspace = true
github.workspace = true
logging.workspace = true
parking_lot.workspace = true
private-files.workspace = true
process.workspace = true
protocol.workspace = true
providers.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
tokio.workspace = true
tracing.workspace = true
update-feed.workspace = true
uuid.workspace = true

[dev-dependencies]
client-core = { workspace = true, features = ["testing"] }
fetching = { workspace = true, features = ["testing"] }
hub = { workspace = true, features = ["testing"] }
# For the times GitHub gives, as a stand-in for it says them.
jiff.workspace = true
logging = { workspace = true, features = ["testing"] }
process = { workspace = true, features = ["testing"] }
proptest.workspace = true
protocol = { workspace = true, features = ["testing"] }
tempfile.workspace = true
# For tests that pause time, so a timeout passes without being waited for.
tokio = { workspace = true, features = ["test-util"] }
waiting.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_WindowsProgramming"] }

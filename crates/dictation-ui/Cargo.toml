[package]
name = "dictation-ui"
description = "Dictation attached to a text field: shortcuts, recording, live text and insertion, independently of a microphone button."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
testing = ["dictation/testing"]

[dependencies]
dictation.workspace = true
flume.workspace = true
gpui-kit.workspace = true
look.workspace = true
# The microphone's permission, and quieting what's playing.
sound.workspace = true
tracing.workspace = true
uuid.workspace = true

# Whether Space is down, by the system's word.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics.workspace = true
objc2-io-kit.workspace = true

[dev-dependencies]
# What the `testing` feature turns on in it, which the tests have without it.
dictation = { workspace = true, features = ["testing"] }
logging = { workspace = true, features = ["testing"] }

[lints]
workspace = true

[package]
name = "agents"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# What only tests use: a longer wait for an agent's last output.
testing = []

[dependencies]
# Reads when a limit starts again, which `get_usage` says as an ISO time.
chrono.workspace = true
process.workspace = true
parking_lot.workspace = true
private-files.workspace = true
protocol.workspace = true
thiserror.workspace = true
async-trait.workspace = true
serde_json.workspace = true
# An empty directory for a one-off call, so the CLI loads no project's instructions.
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
protocol = { workspace = true, features = ["testing"] }

[lints]
workspace = true

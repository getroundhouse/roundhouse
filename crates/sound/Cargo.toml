[package]
name = "sound"
description = "The device's sound: hearing the microphone at the rate its caller asks for, whether the app may, playing through the speakers, and quieting what's playing while something is heard. No UI and no async runtime."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
flume.workspace = true
# Pausing what's playing while something is heard, each platform its own way.
now-playing.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
# Hears the microphone and plays through the speakers: Core Audio on a Mac, WASAPI on Windows and ALSA on Linux.
cpal.workspace = true

# Asking whether the app may use the microphone, and muting the sound output.
[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-av-foundation.workspace = true
objc2-core-audio.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

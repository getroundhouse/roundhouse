[package]
name = "fetching"
description = "Fetching files over HTTP(S), on the caller's thread, such as the app's updates and dictation's model. No UI and no async runtime."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# What only tests use: a local server that answers as it's told.
testing = ["dep:flate2", "dep:parking_lot"]

[dependencies]
# Checks a big file's SHA-256 as it comes.
ring.workspace = true
thiserror.workspace = true
ureq.workspace = true
flate2 = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }

[dev-dependencies]
fetching = { workspace = true, features = ["testing"] }
tempfile.workspace = true
waiting.workspace = true

[lints]
workspace = true

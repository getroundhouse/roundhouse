[package]
name = "process"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# What tests of the crates that start processes share. Cargo says in JSON where it built the hub, and `protocol` names
# the variable that says which process is the test.
testing = ["dep:protocol", "dep:serde_json", "dep:tempfile", "dep:tokio"]

[dependencies]
protocol = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# For the pace a test's hub or worker looks whether its test has gone.
tokio = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
# For `testing::tmp_dir`, which only Unix's tests use, since only there is a hub's socket a path with a limit.
tempfile = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[dev-dependencies]
# What the `testing` feature brings in, which the tests have without it.
protocol.workspace = true
serde_json.workspace = true
tempfile.workspace = true
# With a paused clock, for how it looks whether a test has gone.
tokio = { workspace = true, features = ["test-util"] }
waiting.workspace = true

[lints]
workspace = true

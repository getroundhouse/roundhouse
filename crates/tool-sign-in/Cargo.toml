[package]
name = "tool-sign-in"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# What tests of the hub from outside it need: a stand-in for an MCP server and its authorization server.
testing = ["dep:parking_lot", "dep:waiting"]

[dependencies]
base64.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1"] }
protocol.workspace = true
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-service.workspace = true
url.workspace = true
parking_lot = { workspace = true, optional = true }
waiting = { workspace = true, optional = true }

[dev-dependencies]
# For a web server that redirects, and an address where nothing listens.
fetching = { workspace = true, features = ["testing"] }
# What the `testing` feature brings in, which the tests have without it.
parking_lot.workspace = true
waiting.workspace = true
# For a server whose certificate this machine doesn't trust.
rcgen.workspace = true
tokio-rustls.workspace = true
# For tests that pause time, so a timeout passes without being waited for.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

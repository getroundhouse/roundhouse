[package]
name = "spec-screens"
description = "The spec's screens, for the galleries that draw them: a picture of one, checking it against its approved image in docs/spec/screens, accepting it, and keeping it to look at."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
image = { workspace = true, features = ["png"] }

# What the made-up chats are made with: the fake hub's builders and the records they make. The fake hub is on a Unix
# socket, so the chats are built only where it is.
[target.'cfg(unix)'.dependencies]
client-core = { workspace = true, features = ["testing"] }
protocol = { workspace = true, features = ["testing"] }
serde_json.workspace = true

[lints]
workspace = true

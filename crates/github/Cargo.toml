[package]
name = "github"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# What tests of the hub from outside it need: a stand-in for GitHub, and a hub pointed at it from the environment.
testing = ["dep:parking_lot", "protocol/testing"]

[dependencies]
base64.workspace = true
http.workspace = true
jiff.workspace = true
octocrab.workspace = true
protocol.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
parking_lot = { workspace = true, optional = true }

[dev-dependencies]
# For an address where nothing listens.
fetching = { workspace = true, features = ["testing"] }
# What the `testing` feature brings in, which the tests have without it.
parking_lot.workspace = true
# A pull request with every facet, to set what the stand-in answers with.
protocol = { workspace = true, features = ["testing"] }
# For tests that pause time, so a timeout passes without being waited for.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[package]
name = "tool-server-http"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# What the worker's tests and the hub's need: a stand-in for an MCP server over HTTP.
testing = ["dep:parking_lot", "dep:serde_json"]

[dependencies]
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1"] }
protocol.workspace = true
rustls.workspace = true
tokio.workspace = true
tower-service.workspace = true
parking_lot = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
# What the `testing` feature brings in, which the tests have without it.
parking_lot.workspace = true
serde_json.workspace = true

[lints]
workspace = true

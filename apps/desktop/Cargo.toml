[package]
name = "desktop"
description = "The desktop app."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "roundhouse-desktop"
path = "src/main.rs"

[lib]
name = "desktop"
path = "src/lib.rs"

[features]
# What only tests use: showing that updating failed, without an installed app.
testing = []

[dependencies]
protocol.workspace = true
client-core.workspace = true
transcript.workspace = true
gpui-kit.workspace = true
look.workspace = true
anyhow.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The kit's highlighter is private, so diffs use the same two crates directly. Oniguruma took
# highlighting a large diff from 12.2 s of CPU to 2.6 s.
syntect = { workspace = true, features = ["default-fancy", "regex-onig"] }
two-face = { workspace = true, features = ["syntect-onig"] }
velopack.workspace = true
ureq.workspace = true
flume.workspace = true
ring.workspace = true
libc.workspace = true

[dev-dependencies]
desktop = { workspace = true, features = ["testing"] }
look = { workspace = true, features = ["testing"] }
gpui-kit = { workspace = true, features = ["test-support"] }
image = { workspace = true, features = ["png"] }
tempfile.workspace = true
flate2.workspace = true
parking_lot.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-pre-apple.workspace = true

[lints]
workspace = true

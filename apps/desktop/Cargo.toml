[package]
name = "desktop"
description = "The desktop app."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "roundhouse-desktop"
path = "src/main.rs"

[lib]
name = "desktop"
path = "src/lib.rs"

[features]
# What only tests use: showing that updating failed, or that a check is under way, without an installed app.
testing = []

[dependencies]
protocol.workspace = true
client-core.workspace = true
transcript.workspace = true
gpui-kit.workspace = true
look.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
velopack.workspace = true
ureq.workspace = true
flume.workspace = true
ring.workspace = true
libc.workspace = true
# Turns a pasted image an agent can't be given, such as a TIFF, into a PNG. GPUI already builds these.
image = { workspace = true, features = ["bmp", "png", "tiff"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true

# Reads the file icons' manifest into tables, so the app never parses it.
[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
desktop = { workspace = true, features = ["testing"] }
look = { workspace = true, features = ["testing"] }
transcript = { workspace = true, features = ["testing"] }
gpui-kit = { workspace = true, features = ["test-support"] }
image = { workspace = true, features = ["png"] }
tempfile.workspace = true
flate2.workspace = true
parking_lot.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-pre-apple.workspace = true

[lints]
workspace = true

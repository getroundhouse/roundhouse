[package]
name = "desktop"
description = "The desktop app."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
build = "build/main.rs"

[[bin]]
name = "roundhouse-desktop"
path = "src/main.rs"

[lib]
name = "desktop"
path = "src/lib.rs"

[features]
# What only tests use: showing that updating failed, or that a check is under way, without an installed app, and
# dictating to a stand-in for the model, from audio the test gives it.
testing = ["conversation/testing", "dictation/testing", "dictation-ui/testing"]

[dependencies]
protocol.workspace = true
client-core.workspace = true
# The words a kept recording was biased toward, as its file has them.
hint-words.workspace = true
kept-recordings.workspace = true
local-hub.workspace = true
logging.workspace = true
private-files.workspace = true
transcript.workspace = true
client-ui.workspace = true
# What an MP4 or a QuickTime file says of its video, which the file tab shows, and the system's player plays.
video.workspace = true
terminal-view.workspace = true
gpui-kit.workspace = true
look.workspace = true
written-counts.workspace = true
conversation.workspace = true
dictation.workspace = true
dictation-ui.workspace = true
models = { workspace = true, features = ["download"] }
sound.workspace = true
fetching.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
velopack.workspace = true
update-feed.workspace = true
flume.workspace = true
percent-encoding.workspace = true
qrcode.workspace = true
parking_lot.workspace = true
ring.workspace = true
# The copy of a video from another machine that the system's player opens, which goes once it's done with.
tempfile.workspace = true
tracing.workspace = true
# Turns a pasted image an agent can't be given, such as a TIFF, into a PNG, and decodes the images the file tab draws
# and compares. GPUI already builds these.
image = { workspace = true, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-core-graphics.workspace = true
objc2-foundation.workspace = true
objc2-user-notifications.workspace = true

# Whether the mouse's left button is down, which GPUI doesn't say of a move over the window's frame, a window
# button's command, for a screen reader, which presses it without the pointer, and where a window Windows has snapped
# or minimized is, which GPUI gets wrong.
[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Says which file a failure to embed the app's icon was about.
[build-dependencies]
anyhow.workspace = true
windows-icon.workspace = true

[dev-dependencies]
agents = { workspace = true, features = ["testing"] }
client-core = { workspace = true, features = ["testing"] }
local-hub = { workspace = true, features = ["testing"] }
desktop = { workspace = true, features = ["testing"] }
dictation = { workspace = true, features = ["testing"] }
fetching = { workspace = true, features = ["testing"] }
hub = { workspace = true, features = ["testing"] }
logging = { workspace = true, features = ["testing"] }
look = { workspace = true, features = ["testing"] }
process = { workspace = true, features = ["testing"] }
protocol = { workspace = true, features = ["testing"] }
transcript = { workspace = true, features = ["testing"] }
update-feed = { workspace = true, features = ["testing"] }
worker = { workspace = true, features = ["testing"] }
terminal-view = { workspace = true, features = ["testing"] }
gpui-kit = { workspace = true, features = ["test-support"] }
image = { workspace = true, features = ["png"] }
video = { workspace = true, features = ["testing"] }
tokio.workspace = true
proptest.workspace = true
similar.workspace = true
spec-screens.workspace = true
waiting.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-pre-apple.workspace = true
# The gallery's clips, which it writes as videos.
block2.workspace = true
objc2.workspace = true
objc2-av-foundation = { workspace = true, features = [
    "AVAssetWriter",
    "AVAssetWriterInput",
    "AVVideoSettings",
    "objc2-core-media",
    "objc2-core-video",
] }
objc2-core-foundation.workspace = true
objc2-core-media.workspace = true
objc2-core-video = { workspace = true, features = ["CVBase"] }
objc2-foundation = { workspace = true, features = ["NSDictionary", "NSError", "NSObject", "NSURL", "NSValue"] }

[lints]
workspace = true

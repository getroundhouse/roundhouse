[package]
name = "desktop"
description = "The desktop app."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
build = "build/main.rs"

[[bin]]
name = "roundhouse-desktop"
path = "src/main.rs"

[lib]
name = "desktop"
path = "src/lib.rs"

[features]
# What only tests use: showing that updating failed, or that a check is under way, without an installed app.
testing = []

[dependencies]
protocol.workspace = true
client-core.workspace = true
transcript.workspace = true
gpui-kit.workspace = true
look.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
similar.workspace = true
velopack.workspace = true
ureq.workspace = true
flume.workspace = true
ring.workspace = true
libc.workspace = true
# Turns a pasted image an agent can't be given, such as a TIFF, into a PNG, and decodes the images the file tab draws
# and compares. GPUI already builds these.
image = { workspace = true, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true

# Whether the mouse's left button is down, which GPUI doesn't say of a move over the window's frame, and a window
# button's command, for a screen reader, which presses it without the pointer.
[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle.workspace = true
windows-sys = { workspace = true, features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

# Reads the file icons' manifest into tables, so the app never parses it, and says which file a failure was about.
[build-dependencies]
serde_json.workspace = true
anyhow.workspace = true

[dev-dependencies]
client-core = { workspace = true, features = ["testing"] }
desktop = { workspace = true, features = ["testing"] }
look = { workspace = true, features = ["testing"] }
transcript = { workspace = true, features = ["testing"] }
gpui-kit = { workspace = true, features = ["test-support"] }
image = { workspace = true, features = ["png"] }
tempfile.workspace = true
flate2.workspace = true
parking_lot.workspace = true
proptest.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-pre-apple.workspace = true

[lints]
workspace = true

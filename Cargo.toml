    "tools/stand-ins/stand-in-hub",
]
# The mobile proof of concept is a standalone project with its own lockfiles and pinned GPUI snapshots. The copies in
# `third_party/` are upstream's code, gpui-kit's its workspace cut down, and each keeps upstream's manifests and lints
# rather than ours.
exclude = [
    "mobile-poc",
    "third_party/gpui-kit/vendor",
    "third_party/gpui-pre-apple",
    "third_party/gpui-pre-ios",
    "third_party/zed-font-kit",
]

[workspace.package]
version = "0.1.0"
# `crates/now-playing/build.rs` gives `rustc` the same edition by hand, as it compiles its crate alone.
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
process = { path = "crates/process" }
private-files = { path = "crates/private-files" }
protocol = { path = "crates/protocol" }
agents = { path = "crates/agents" }
providers = { path = "crates/providers" }
worker = { path = "crates/worker" }
github = { path = "crates/github" }
hub = { path = "crates/hub" }
client-core = { path = "crates/client-core" }
local-hub = { path = "crates/local-hub" }
logging = { path = "crates/logging" }
hint-words = { path = "crates/hint-words" }
kept-recordings = { path = "crates/kept-recordings" }
transcript = { path = "crates/transcript" }
client-ui = { path = "crates/client-ui" }
look = { path = "crates/look" }
dictation = { path = "crates/dictation" }
dictation-ui = { path = "crates/dictation-ui" }
fetching = { path = "crates/fetching" }
models = { path = "crates/models" }
sound = { path = "crates/sound" }
phonon = { path = "crates/phonon" }
speaking = { path = "crates/speaking" }
conversation = { path = "crates/conversation" }
now-playing = { path = "crates/now-playing" }
update-feed = { path = "crates/update-feed" }
windows-icon = { path = "crates/windows-icon" }
waiting = { path = "crates/waiting" }
written-counts = { path = "crates/written-counts" }
spec-screens = { path = "crates/spec-screens" }
terminal-state = { path = "crates/terminal-state" }
terminal-view = { path = "crates/terminal-view" }
video = { path = "crates/video" }
libvpx-build = { path = "crates/libvpx-build" }
desktop = { path = "apps/desktop" }
mobile-ios = { path = "apps/mobile-ios" }
kit-sync = { path = "tools/kit-sync" }

anyhow = "1.0.104"
async-trait = "0.1.92"
# Already under ureq. Carries an attachment's bytes as text, the way JSON has to.
base64 = "0.23.1"
# Already under objc2's crates. The blocks a Mac calls with whether the app may use the microphone, and with what it
# allows of notifications.
block2 = "0.6.2"
# Already under the build scripts of several crates. Compiles libvpx, which the `video` crate's build script fetches.
cc = { version = "1.11.2", features = ["parallel"] }
clap = { version = "4.6.8", features = ["derive"] }
# Decodes the speech eval's recordings, which are FLAC.
claxon = "0.4.3"
# Hears the microphone and plays through the speakers. On a Mac it's Core Audio through objc2's bindings, with nothing
# generated as it builds, on Windows WASAPI, and on Linux ALSA, which builds against libasound2-dev.
cpal = "0.18.2"
# Already under GPUI. Picks the names the hub gives workspaces at random.
fastrand = "2.5.0"
flume = "0.12.0"
# Already under GPUI. Compresses what a test serves, as a web server would.
flate2 = "1.1.11"
# Our copy of Longbridge's kit, on the release `tools/kit-sync` pins, with our changes, as `third_party/README.md`
# says. It pins exact GPUI snapshots, so a release is taken deliberately, and `tools/kit-sync` moves the version here
# with it.
gpui-kit = { path = "third_party/gpui-kit/vendor/crates/kit", version = "=0.10.0", features = ["syntect"] }
# Moves with gpui-kit, as `tools/kit-sync` moves it: the version its GPUI uses. Only for drawing off the main thread,
# which tests run on.
gpui-pre-apple = { version = "=0.3.12", features = ["font-kit"] }
# Zed's iOS backend for GPUI, for the iOS app, on the version gpui-pre-apple is. Our copy, with two changes, as
# `third_party/README.md` says, which `[patch.crates-io]` below puts in its place.
gpui_ios = { package = "gpui-pre-ios", version = "=0.3.12", features = ["runtime_shaders"] }
# The same as GPUI's, which hands its screenshots back as this crate's images.
image = { version = "0.25.10", default-features = false }
# Already under Octocrab. Names the header that asks GitHub's device flow to answer in JSON, on a request Octocrab sends.
http = "1.5.0"
# Already under GPUI. Reads a request's body for the worker's tools, up to a limit.
http-body-util = "0.1.5"
# Already under GPUI. Serves the worker's tools to its agents, over HTTP on 127.0.0.1.
hyper = { version = "1.12.0", features = ["http1", "server"] }
# Already under GPUI. Runs hyper's connections on tokio.
hyper-util = { version = "0.1.21", features = ["tokio"] }
# Says when something happened in the local time zone, and reads the times services write.
jiff = "1.0.1"
libc = "0.2.191"
# Already under tracing-subscriber, which hears what's logged with it, such as by GPUI.
log = "0.4.35"
# Ghostty's terminal core, through bindings pinned to the commit that builds its 1.0.1, which isn't on crates.io yet.
# Its build script builds Ghostty with Zig 0.17, which has to be on the PATH, and fetches Ghostty's source as it builds.
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "483ea3d5247b214060da58ef6037a95f30ae89fb" }
# Already under GPUI, whose drawing of SVG shapes text with it. Measures a Mermaid diagram's words, so its boxes fit them.
rustybuzz = "0.20.1"
# Already under GPUI, which draws SVG with it. Reads a drawing the agent points to before GPUI draws it, so it shows no
# file it names by its path, which GPUI's options would read. GPUI turns on its `text` feature, which lays out a
# drawing's words.
usvg = { version = "0.46.0", default-features = false, features = ["text"] }
# Already under gpui-kit, whose text view parses Markdown with it. Finds the images the agent's text points to as the
# text view does, and reads the guide's pages as GitHub does. 1.0.0 panics on some texts, as wooorm/markdown-rs#275
# says, so each call the repo makes into it, directly or through the kit's `parse_markdown`, catches a panic. The kit's
# text view doesn't. 1.0.0 is its latest release, of April 2025, and nothing has been pushed to it since, so the guards
# stay until a release fixes the panic.
markdown = "1.0.0"
# Reads the WebM a video an agent made is in, frame by frame, for libvpx to decode.
matroska-demuxer = "0.8.1"
# Writes the spec's page as HTML, escaping what it puts in.
maud = "0.27.0"
# Draws the Mermaid diagrams the agent writes, as SVG, in Rust, with no browser or JavaScript. Only the kinds of diagram
# the transcript draws, since each adds to the build. MIT or Apache-2.0, though it brings `cssparser`, `cssparser-macros`
# and `dtoa-short`, which are MPL-2.0, which `tools/policy` allows.
merman = { version = "0.10.0", default-features = false }
# Already under serde_json. Finds and counts the line endings in a file the worker reads a few lines of at a time.
memchr = "2.8.3"
# Already under gpui-component. Tells a worker when git writes a worktree's branches, from the OS's own file events.
notify = "8.2.2"
# Already under GPUI. Gives GPUI's view on a Mac the accessibility answer it lacks.
objc2 = "0.6.5"
# Already under GPUI. Taps a Mac's trackpad as a sidebar's edge takes its usual width, plays the sound for a chat
# that needs a look, and badges the Dock's icon with how many workspaces have one.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSHapticFeedback", "NSResponder", "NSSound"] }
# Asks a Mac whether the app may use the microphone, and has the system ask the person. The gallery writes its clips as
# videos with it too.
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
# Already under cpal. Mutes a Mac's sound output while it's dictated to, if the person has chosen it.
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware"] }
# Already under GPUI. Owns the frames of a clip, as the gallery hands them to the video it writes.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
# Already under GPUI. Asks a Mac whether Space is down, since letting go of it while another app is in front tells only
# that app, and whether agents may record the screen, and has the system ask the person for either.
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation", "CGWindow"] }
# The times of a clip's frames, as the gallery writes them into a video.
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMTime"] }
# Runs dictation's model on a Mac, on Core ML.
objc2-core-ml = { version = "0.3.2", default-features = false, features = ["std", "block2", "MLDictionaryFeatureProvider", "MLFeatureProvider", "MLFeatureValue", "MLModel", "MLModelConfiguration", "MLMultiArray"] }
# Already under GPUI. The frames of a clip, as the gallery hands them to the video it writes.
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
# Already under GPUI. Hands the sound for a chat that needs a look to AppKit, by its bytes or its name, finds the
# folders the computer keeps alert sounds in, and tells whether the app runs from its bundle, which notifications need.
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSData", "NSEnumerator", "NSError", "NSPathUtilities", "NSString"] }
# Asks a Mac whether the app may monitor input, which, unlike Core Graphics, also says whether it has been asked.
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "hidsystem"] }
# Already under GPUI. Asks a Mac what it allows of the app's notifications, and asks for the Dock's badge with them.
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNNotificationSettings", "UNUserNotificationCenter"] }
# The hub's calls to GitHub's API, such as asking whose a token is. Only hyper's client, and rustls on ring with the
# system's certificates, which the tree has already. Not its retries or its redirects, nor its timeouts, which the
# hub's one time limit on each call covers, nor its tracing, which would turn on tracing's `log` wherever the hub is
# built, nor the JWTs only an app's key needs.
octocrab = { version = "0.54.9", default-features = false, features = ["default-client", "rustls", "rustls-ring"] }
parking_lot = "0.12.5"
# Wezterm's, under MIT. Runs a terminal's shell in a PTY on Unix, and in a pseudoconsole on Windows.
portable-pty = "0.9.0"
# Already under GPUI, through `url`. Reads the address of an image the agent's text points to, which can be escaped,
# and the code GitHub sends the desktop app back with once an app of your own is made.
percent-encoding = "2.3.2"
proptest = "1.12.0"
# Gradium's Phonon, which speaks a chat's replies on the CPU, as `docs/decisions/phonon-speaks-replies.md` says. `hf` reads
# the model's tokenizer. Its own downloading, `hub`, stays off, so the model comes through `models`, checked.
ptts = { version = "0.7.1", default-features = false, features = ["hf"] }
# Already under every derive. Reads the workspace's Rust as tokens, so a policy test finds attributes and macros in
# its code, not in its strings and comments.
proc-macro2 = "1.0.107"
# Already under GPUI. The window's handle on Windows, for asking Windows to do what a window button does.
raw-window-handle = "0.6.2"
# The Fourier transform dictation's model's features are made with.
realfft = "3.5.1"
# Already under rustls. Checks the update feed's signature.
ring = "0.17.14"
# SQLite bundled, with its statement cache and checked `u64` and `usize` conversions, and without the WASM bindings it
# turns on by default.
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled", "cache", "fallible_uint"] }
# Already under GPUI on a Mac. The Keychain on iOS, which keeps the token a hub gave the phone.
security-framework = "3.7.0"
serde = { version = "1.0.229", features = ["derive"] }
# With `raw_value`, so a terminal's rows are kept, compared and passed on as JSON, rather than read into their types.
serde_json = { version = "1.0.154", features = ["raw_value"] }
# Already under uuid, whose v5 IDs the worker makes. Hashes a changed file as git hashes a blob, to give it a version
# that changes when its content does.
sha1_smol = "1.0.1"
# Already under gpui-kit, whose diff uses it. Works out an edit's lines before its patch comes back, and what changed
# within a line of a diff.
similar = "2.7.0"
syntect = { version = "5.3.0", default-features = false }
# A hub installed as a service unpacks the archive of the release it updates to. Without xattr, which reads and sets
# extended attributes nothing here wants.
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.1"
tokio = { version = "1.54.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
two-face = { version = "0.4.5", default-features = false }
# Already under gpui-kit. Moves an end of what's selected in the transcript's texts by a character as a person sees
# one, as the kit's text boxes do.
unicode-segmentation = "1.13.3"
# The one Velopack uses, with its TLS, which `fetching` fetches the update feed and dictation's model with.
ureq = "3.5.2"
uuid = { version = "1.29.3", features = ["v4"] }
# Exact, because tools/package/dotnet-tools.json pins vpk, which makes the packages this reads, to the same version.
# `public-utils` makes public a type that its `UpdateSource` trait names, so another crate can implement it. Its
# `file-logging` would add a log file and a panic hook, so it stays off.
velopack = { version = "=1.2.161", features = ["public-utils"] }
# Already under tokio and GPUI. The Win32 API, for what std leaves out on Windows: a process's descendants and start
# time, and reading a named pipe while writing to it.
windows-sys = "0.61.2"
# Already under GPUI and cpal. The WinRT API, which `windows-sys` doesn't cover: the media sessions `now-playing` pauses.
windows = "0.62.2"

# docs/standards/rust.md says what each of these is for.

# Devices pair directly with a hub over TLS 1.3, using ring as the existing TLS dependencies do.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
webpki = { package = "rustls-webpki", version = "0.103.17", default-features = false, features = ["std"] }
# TCP keepalive timings; tokio already uses this crate.
socket2 = { version = "0.6.5", features = ["all"] }
# A pairing link can be scanned on a phone as well as pasted on a desktop.
qrcode = { version = "0.14.1", default-features = false }
# Refuse control and format characters in device names displayed in terminals.
unicode-properties = { version = "0.1.5", default-features = false, features = ["general-category"] }

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
assert_is_empty = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
self_named_module_files = "warn"
definition_in_module_root = "warn"
undocumented_unsafe_blocks = "warn"

[workspace.lints.cargo]
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# Line numbers for backtraces, without the rest of the debug info, which only a debugger reads. On a Mac, each
# incremental rebuild leaves its object files, and the debug info in them, in `target/debug/build`, and nothing deletes
# them, so a checkout that rebuilds all day grows by tens of GB. With line tables only they're about a quarter the size,
# and rebuilds are no slower. `split-debuginfo = "packed"` would stop them piling up, but it runs `dsymutil` over every
# test binary that links, which made a rebuild of the desktop app's tests about 20 s slower.
[profile.dev]
debug = "line-tables-only"

# GPUI is unusably slow unoptimized, and dependencies only build once. They're built without debug info, so a backtrace's
# frames inside one have no line numbers, while our own crates' frames, and where any panic happened, keep theirs. Linux
# links every crate's line tables into each test binary, so there `target` came out a third smaller, a cold build 26%
# faster, and a rebuild after an edit wrote half as much. On a Mac, which leaves them in the object files, `target` came
# out 15% smaller. Optimized, `xn-gemm-common` 0.20.2, under Phonon, builds on Linux and Windows on arm64: four of its
# half-precision functions don't enable the CPU feature their instructions need, so they assemble only once inlined into
# callers that enable it, which run only on a CPU that has it. Unoptimized, they fail with `instruction requires:
# fullfp16`.
[profile.dev.package."*"]
opt-level = 2
debug = false

# Turning a frame into the pixels GPUI draws is arithmetic over every pixel, 60 times a second, which takes 3.5 ms for a
# 2880 × 1800 frame optimized, and 211 ms not, so a video plays in a debug build of the app as it does in a release.
[profile.dev.package.video]
opt-level = 3

# Our copies of Zed's iOS backend, GPUI's Apple text system and Zed's font-kit, with the changes `third_party/README.md`
# lists, in place of the ones on crates.io.
[patch.crates-io]
gpui-pre-apple = { path = "third_party/gpui-pre-apple" }
gpui-pre-ios = { path = "third_party/gpui-pre-ios" }
zed-font-kit = { path = "third_party/zed-font-kit" }

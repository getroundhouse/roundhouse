[workspace]
resolver = "3"
members = [
    "crates/process",
    "crates/private-files",
    "crates/protocol",
    "crates/agents",
    "crates/providers",
    "crates/worker",
    "crates/github",
    "crates/hub",
    "crates/client-core",
    "apps/daemon",
    "apps/cli",
    "apps/desktop",
    "crates/transcript",
    "crates/look",
    "crates/terminal-state",
    "crates/dictation",
    "crates/dictation-ui",
    "crates/fetching",
    "crates/update-feed",
    "crates/waiting",
    "crates/terminal-view",
    "tools/policy",
    "tools/guide",
    "tools/kit-sync",
    "tools/spec-page",
    "tools/update-steps",
    "tools/stand-ins/fake-claude",
    "tools/stand-ins/login-standin",
    "tools/stand-ins/native-standin",
    "tools/stand-ins/recording-adapter",
    "tools/stand-ins/stand-in-hub",
]
# Everything that builds without GPUI, so `cargo test` stays fast and works on a Linux server. Use
# `--workspace` for the window too.
default-members = [
    "crates/process",
    "crates/private-files",
    "crates/protocol",
    "crates/agents",
    "crates/providers",
    "crates/worker",
    "crates/github",
    "crates/hub",
    "crates/client-core",
    "apps/daemon",
    "apps/cli",
    "crates/terminal-state",
    "crates/dictation",
    "crates/fetching",
    "crates/update-feed",
    "crates/waiting",
    "tools/policy",
    "tools/guide",
    "tools/kit-sync",
    "tools/spec-page",
    "tools/update-steps",
    "tools/stand-ins/fake-claude",
    "tools/stand-ins/login-standin",
    "tools/stand-ins/native-standin",
    "tools/stand-ins/recording-adapter",
    "tools/stand-ins/stand-in-hub",
]
# The mobile proof of concept is a standalone project with its own lockfiles and pinned GPUI snapshots. The copy of
# gpui-kit is upstream's workspace, cut down, whose crates keep upstream's manifests and lints rather than ours.
exclude = ["mobile-poc", "third_party/gpui-kit/vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
process = { path = "crates/process" }
private-files = { path = "crates/private-files" }
protocol = { path = "crates/protocol" }
agents = { path = "crates/agents" }
providers = { path = "crates/providers" }
worker = { path = "crates/worker" }
github = { path = "crates/github" }
hub = { path = "crates/hub" }
client-core = { path = "crates/client-core" }
transcript = { path = "crates/transcript" }
look = { path = "crates/look" }
dictation = { path = "crates/dictation" }
dictation-ui = { path = "crates/dictation-ui" }
fetching = { path = "crates/fetching" }
update-feed = { path = "crates/update-feed" }
waiting = { path = "crates/waiting" }
terminal-state = { path = "crates/terminal-state" }
terminal-view = { path = "crates/terminal-view" }
desktop = { path = "apps/desktop" }
kit-sync = { path = "tools/kit-sync" }

anyhow = "1.0.104"
async-trait = "0.1.92"
# Already under GPUI. Carries an attachment's bytes as text, the way JSON has to.
base64 = "0.22.1"
# Already under objc2's crates. The block a Mac calls with whether the app may use the microphone.
block2 = "0.6.2"
clap = { version = "4.6.7", features = ["derive"] }
# Hears the microphone. On a Mac it's Core Audio through objc2's bindings, with nothing generated as it builds.
cpal = "0.18.2"
# Already under GPUI. Picks the names the hub gives workspaces at random.
fastrand = "2.5.0"
flume = "0.12.0"
# Already under GPUI. Compresses what a test serves, as a web server would.
flate2 = "1.1.11"
# Our copy of Longbridge's kit, on the release `tools/kit-sync` pins, with our changes, as `third_party/README.md`
# says. It pins exact GPUI snapshots, so a release is taken deliberately, and `tools/kit-sync` moves the version here
# with it.
gpui-kit = { path = "third_party/gpui-kit/vendor/crates/kit", version = "=0.10.0", features = ["syntect"] }
# Moves with gpui-kit, as `tools/kit-sync` moves it: the version its GPUI uses. Only for drawing off the main thread,
# which tests run on.
gpui-pre-apple = { version = "=0.3.12", features = ["font-kit"] }
# The same as GPUI's, which hands its screenshots back as this crate's images.
image = { version = "0.25.10", default-features = false }
# Already under Octocrab. Names the header that asks GitHub's device flow to answer in JSON, on a request Octocrab sends.
http = "1.5.0"
# Already under GPUI. Reads a request's body for the worker's tools, up to a limit.
http-body-util = "0.1.5"
# Already under GPUI. Serves the worker's tools to its agents, over HTTP on 127.0.0.1.
hyper = { version = "1.12.0", features = ["http1", "server"] }
# Already under GPUI. Runs hyper's connections on tokio.
hyper-util = { version = "0.1.21", features = ["tokio"] }
# Says when something happened in the local time zone, and reads the times services write.
jiff = "1.0.0"
libc = "0.2.191"
# Ghostty's terminal core, through bindings pinned to the commit that builds its 1.0.1, which isn't on crates.io yet.
# Its build script builds Ghostty with Zig 0.17, which has to be on the PATH, and fetches Ghostty's source as it builds.
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "483ea3d5247b214060da58ef6037a95f30ae89fb" }
# Already under GPUI, which draws SVG with it. Reads a drawing the agent points to before GPUI draws it, so it shows no
# file it names by its path, which GPUI's options would read. GPUI turns on its `text` feature, which lays out a
# drawing's words.
usvg = { version = "0.46.0", default-features = false, features = ["text"] }
# Already under gpui-kit, whose text view parses Markdown with it. Finds the images the agent's text points to as the
# text view does, and reads the guide's pages as GitHub does. 1.0.0 panics on some texts, as wooorm/markdown-rs#275
# says, so each call the repo makes into it, directly or through the kit's `parse_markdown`, catches a panic. The kit's
# text view doesn't. 1.0.0 is its latest release, of April 2025, and nothing has been pushed to it since, so the guards
# stay until a release fixes the panic.
markdown = "1.0.0"
# Writes the spec's page as HTML, escaping what it puts in.
maud = "0.27.0"
# Already under serde_json. Finds and counts the line endings in a file the worker reads a few lines of at a time.
memchr = "2.8.3"
# Already under gpui-component. Tells a worker when git writes a worktree's branches, from the OS's own file events.
notify = "8.2.2"
# Already under GPUI. Gives GPUI's view on a Mac the accessibility answer it lacks.
objc2 = "0.6.5"
# Already under GPUI. Taps a Mac's trackpad as a sidebar's edge takes its usual width, and plays the sound for a chat
# that needs a look.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSHapticFeedback", "NSSound"] }
# Asks a Mac whether the app may use the microphone, and has the system ask the person.
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
# Already under cpal. Mutes a Mac's sound output while it's dictated to, if the person has chosen it.
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware"] }
# Runs dictation's model on a Mac, on Core ML.
objc2-core-ml = { version = "0.3.2", default-features = false, features = ["std", "block2", "MLDictionaryFeatureProvider", "MLFeatureProvider", "MLFeatureValue", "MLModel", "MLModelConfiguration", "MLMultiArray"] }
# Already under GPUI. Hands the sound for a chat that needs a look to AppKit, by its bytes or its name, and finds the
# folders the computer keeps alert sounds in.
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSEnumerator", "NSPathUtilities", "NSString"] }
# The hub's calls to GitHub's API, such as asking whose a token is. Only hyper's client, and rustls on ring with the
# system's certificates, which the tree has already. Not its retries or its redirects, nor its timeouts, which the
# hub's one time limit on each call covers, nor its tracing, which would turn on tracing's `log` wherever the hub is
# built, nor the JWTs only an app's key needs.
octocrab = { version = "0.54.9", default-features = false, features = ["default-client", "rustls", "rustls-ring"] }
parking_lot = "0.12.5"
# Wezterm's, under MIT. Runs a terminal's shell in a PTY on Unix, and in a pseudoconsole on Windows.
portable-pty = "0.9.0"
# Already under GPUI, through `url`. Reads the address of an image the agent's text points to, which can be escaped,
# and the code GitHub sends the desktop app back with once an app of your own is made.
percent-encoding = "2.3.2"
proptest = "1.12.0"
# Already under GPUI. The window's handle on Windows, for asking Windows to do what a window button does.
raw-window-handle = "0.6.2"
# The Fourier transform dictation's model's features are made with.
realfft = "3.5.1"
# Already under rustls. Checks the update feed's signature.
ring = "0.17.14"
# SQLite bundled, with its statement cache and checked `u64` and `usize` conversions, and without the WASM bindings 0.42
# turns on by default.
rusqlite = { version = "0.42.0", default-features = false, features = ["bundled", "cache", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Already under gpui-kit, whose diff uses it. Works out an edit's lines before its patch comes back, and what changed
# within a line of a diff.
similar = "2.7.0"
syntect = { version = "5.3.0", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.1"
tokio = { version = "1.54.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
two-face = { version = "0.4.5", default-features = false }
# The one Velopack uses, with its TLS, which `fetching` fetches the update feed and dictation's model with.
ureq = "3.5.2"
uuid = { version = "1.29.2", features = ["v4"] }
# Exact, because tools/package/dotnet-tools.json pins vpk, which makes the packages this reads, to the same version.
# `public-utils` makes public a type that its `UpdateSource` trait names, so another crate can implement it. Its
# `file-logging` would add a log file and a panic hook, so it stays off.
velopack = { version = "=1.2.161", features = ["public-utils"] }
# Already under tokio and GPUI. The Win32 API, for what std leaves out on Windows: a process's descendants and start
# time, and reading a named pipe while writing to it.
windows-sys = "0.61.2"

# docs/rust.md says what each of these is for.

# Devices pair directly with a hub over TLS 1.3, using ring as the existing TLS dependencies do.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
webpki = { package = "rustls-webpki", version = "0.103.17", default-features = false, features = ["std"] }
# TCP keepalive timings; tokio already uses this crate.
socket2 = { version = "0.6.5", features = ["all"] }
# A pairing link can be scanned on a phone as well as pasted on a desktop.
qrcode = { version = "0.14.1", default-features = false }
# Refuse control and format characters in device names displayed in terminals.
unicode-properties = { version = "0.1.5", default-features = false, features = ["general-category"] }

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
assert_is_empty = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
self_named_module_files = "warn"
definition_in_module_root = "warn"
undocumented_unsafe_blocks = "warn"

[workspace.lints.cargo]
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# Line numbers for backtraces, without the rest of the debug info, which only a debugger reads. On a Mac, each
# incremental rebuild leaves its object files, and the debug info in them, in `target/debug/build`, and nothing deletes
# them, so a checkout that rebuilds all day grows by tens of GB. With line tables only they're about a quarter the size,
# and rebuilds are no slower. `split-debuginfo = "packed"` would stop them piling up, but it runs `dsymutil` over every
# test binary that links, which made a rebuild of the desktop app's tests about 20 s slower.
[profile.dev]
debug = "line-tables-only"

# GPUI is unusably slow unoptimized, and dependencies only build once. They're built without debug info, so a backtrace's
# frames inside one have no line numbers, while our own crates' frames, and where any panic happened, keep theirs. Linux
# links every crate's line tables into each test binary, so there `target` came out a third smaller, a cold build 26%
# faster, and a rebuild after an edit wrote half as much. On a Mac, which leaves them in the object files, `target` came
# out 15% smaller.
[profile.dev.package."*"]
opt-level = 2
debug = false

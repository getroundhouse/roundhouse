# Everything that builds without GPUI, so `cargo test` stays fast and works on a Linux server. Use
# `--workspace` for the window too.
default-members = [
    "crates/process",
    "crates/private-files",
    "crates/protocol",
    "crates/agents",
    "crates/providers",
    "crates/worker",
    "crates/github",
    "crates/hub",
    "crates/client-core",
    "crates/local-hub",
    "crates/logging",
    "apps/daemon",
    "apps/cli",
    "crates/terminal-state",
    "crates/dictation",
    "crates/now-playing",
    "crates/fetching",
    "crates/models",
    "crates/sound",
    "crates/phonon",
    "crates/speaking",
    "crates/conversation",
    "crates/update-feed",
    "crates/windows-icon",
    "crates/waiting",
    "crates/written-counts",
    "crates/video",
    "crates/kept-recordings",
    "crates/hint-words",
    "crates/libvpx-build",
    "tools/policy",
    "tools/guide",
    "tools/kit-sync",
    "tools/spec-page",

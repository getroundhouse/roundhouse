[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/agents",
    "crates/providers",
    "crates/worker",
    "crates/hub",
    "crates/client-core",
    "apps/daemon",
    "apps/cli",
    "tools/policy",
]
# The prototypes are standalone projects with their own lockfiles and pinned GPUI snapshots.
exclude = ["bakeoff", "mobile-poc"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
protocol = { path = "crates/protocol" }
agents = { path = "crates/agents" }
providers = { path = "crates/providers" }
worker = { path = "crates/worker" }
hub = { path = "crates/hub" }
client-core = { path = "crates/client-core" }

anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
flume = "0.11"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

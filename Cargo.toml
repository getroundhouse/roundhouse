[workspace]
resolver = "3"
members = [
    "crates/process",
    "crates/protocol",
    "crates/agents",
    "crates/providers",
    "crates/worker",
    "crates/hub",
    "crates/client-core",
    "apps/daemon",
    "apps/cli",
    "apps/desktop",
    "apps/mobile-ios",
    "crates/transcript",
    "crates/look",
    "tools/policy",
]
# Everything that builds without GPUI, so `cargo test` stays fast and works on a Linux server. Use
# `--workspace` for the window too.
default-members = [
    "crates/process",
    "crates/protocol",
    "crates/agents",
    "crates/providers",
    "crates/worker",
    "crates/hub",
    "crates/client-core",
    "apps/daemon",
    "apps/cli",
    "tools/policy",
]
# The mobile proof of concept is a standalone project with its own lockfiles and pinned GPUI snapshots.
# `third_party/` holds other people's crates, changed for this app, which the repo's own standards don't cover.
exclude = ["mobile-poc", "third_party"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
process = { path = "crates/process" }
protocol = { path = "crates/protocol" }
agents = { path = "crates/agents" }
providers = { path = "crates/providers" }
worker = { path = "crates/worker" }
hub = { path = "crates/hub" }
client-core = { path = "crates/client-core" }
transcript = { path = "crates/transcript" }
look = { path = "crates/look" }
desktop = { path = "apps/desktop" }

anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
flume = "0.11"
# Already under GPUI. Compresses what a test serves, as a web server would.
flate2 = "1"
# Exact, because gpui-kit pins exact GPUI snapshots and upgrades should be deliberate.
gpui-kit = { version = "=0.9.0", features = ["syntect"] }
# Moves with gpui-kit: the version its GPUI uses. Only for drawing off the main thread, which tests run on.
gpui-pre-apple = { version = "=0.3.11", features = ["font-kit"] }
# Zed's iOS backend for GPUI. Moves with gpui-kit too, and is patched below.
gpui_ios = { package = "gpui-pre-ios", version = "=0.3.11", features = ["runtime_shaders"] }
# The same as GPUI's, which hands its screenshots back as this crate's images.
image = { version = "0.25", default-features = false }
libc = "0.2"
parking_lot = "0.12"
proptest = "1"
qrcode = { version = "0.14", default-features = false }
# TLS for devices that reach a hub over the network, on ring. aws-lc-rs, rustls' default, is under a license that
# includes the OpenSSL license, which tools/policy doesn't allow. Only TLS 1.3 is used, so tls12 stays off.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
# Also checks the update feed's signature.
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
# The Keychain on iOS.
security-framework = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TCP keepalive's timings, which std can't set. `all` has the number of probes. tokio already builds it.
socket2 = { version = "0.6", features = ["all"] }
syntect = { version = "5", default-features = false }
tempfile = "3"
thiserror = "2"
toml = "0.9"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
two-face = { version = "0.4", default-features = false }
# Already in Cargo.lock. Tells format characters, such as bidi overrides, from the rest.
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
# The one Velopack uses, with its TLS, for fetching the update feed.
ureq = "3"
uuid = { version = "1", features = ["v4"] }
# Exact, because tools/package/dotnet-tools.json pins vpk, which makes the packages this reads, to the same version.
# `public-utils` makes public a type that its `UpdateSource` trait names, so another crate can implement it. Its
# `file-logging` would add a log file and a panic hook, so it stays off.
velopack = { version = "=1.2.161", features = ["public-utils"] }

# docs/rust.md says what each of these is for.
[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
mod_module_files = "warn"
undocumented_unsafe_blocks = "warn"

# GPUI is unusably slow unoptimized, and dependencies only build once.
[profile.dev.package."*"]
opt-level = 2

# Zed's iOS backend, with two changes in `third_party/gpui-pre-ios`, each marked "Changed for Roundhouse": its
# display link asks for 120 Hz, which an iPhone otherwise holds to 60, and it finds the length of an input that
# doesn't report one, such as gpui-kit's, without which the keyboard never appears. Both belong upstream.
[patch.crates-io]
gpui-pre-ios = { path = "third_party/gpui-pre-ios" }

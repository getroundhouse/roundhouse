    { path = "rusqlite::Row::get", reason = "a column read by its number has to match the query's `SELECT` by hand, and one that doesn't reads another column, or fails only as the hub runs. The hub reads a column that a `columns!` declaration names, with `ByColumn::at` or `ByColumn::borrowed_at`, and a query's one value with `OneValue::read`, as crates/hub/src/store/columns.rs says. Where SQLite fixes the columns, such as a `PRAGMA`'s reply, or a test reads a table in its own order on purpose, #[expect] this with which it is" },
    { path = "rusqlite::Row::get_ref", reason = "a column read by its number has to match the query's `SELECT` by hand, and one that doesn't reads another column, or fails only as the hub runs. The hub reads a column that a `columns!` declaration names, with `ByColumn::at` or `ByColumn::borrowed_at`, and a query's one value with `OneValue::read`, as crates/hub/src/store/columns.rs says. Where SQLite fixes the columns, such as a `PRAGMA`'s reply, or a test reads a table in its own order on purpose, #[expect] this with which it is" },
    { path = "rusqlite::Row::get_unwrap", reason = "a column read by its number has to match the query's `SELECT` by hand, and one that doesn't reads another column, or fails only as the hub runs. The hub reads a column that a `columns!` declaration names, with `ByColumn::at` or `ByColumn::borrowed_at`, and a query's one value with `OneValue::read`, as crates/hub/src/store/columns.rs says. Where SQLite fixes the columns, such as a `PRAGMA`'s reply, or a test reads a table in its own order on purpose, #[expect] this with which it is" },
    { path = "rusqlite::Row::get_ref_unwrap", reason = "a column read by its number has to match the query's `SELECT` by hand, and one that doesn't reads another column, or fails only as the hub runs. The hub reads a column that a `columns!` declaration names, with `ByColumn::at` or `ByColumn::borrowed_at`, and a query's one value with `OneValue::read`, as crates/hub/src/store/columns.rs says. Where SQLite fixes the columns, such as a `PRAGMA`'s reply, or a test reads a table in its own order on purpose, #[expect] this with which it is" },
]

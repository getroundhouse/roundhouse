allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-dbg-in-tests = true
too-many-lines-threshold = 60
disallowed-types = [
    { path = "std::sync::Mutex", reason = "use parking_lot::Mutex; see docs/rust.md" },
    { path = "std::sync::RwLock", reason = "use parking_lot::RwLock; see docs/rust.md" },
]

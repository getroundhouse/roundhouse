allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-dbg-in-tests = true
too-many-lines-threshold = 60
disallowed-types = [
    { path = "std::sync::Mutex", reason = "use parking_lot::Mutex; see docs/standards/rust.md" },
    { path = "std::sync::RwLock", reason = "use parking_lot::RwLock; see docs/standards/rust.md" },
]
disallowed-methods = [
    { path = "std::thread::sleep", reason = "a test waits for what it means to, with `waiting::thread`, and never a while, which a slow machine loses, as docs/standards/testing.md says. Where something has to pass a time, such as the product's pace between retries or a stand-in's between looks, #[expect] this with what the time is for" },
    { path = "tokio::time::sleep", reason = "a test waits for what it means to, with `waiting::task`, and never a while, which a slow machine loses, as docs/standards/testing.md says. Where something has to pass a time, such as the product's pace between retries, or a test's on tokio's paused clock, which moves it, #[expect] this with what the time is for" },
    { path = "tokio::time::sleep_until", reason = "a test waits for what it means to, with `waiting::task`, and never until a time, which a slow machine loses, as docs/standards/testing.md says. Where something has to wait for a time, such as the product's timer, or a test's on tokio's paused clock, which moves it, #[expect] this with what the time is for" },
    { path = "gpui_kit::component::text::TextView::markdown", reason = "the kit's text view ends the app on a text its Markdown parser panics on, gives a long text no height until it's read, and keeps what's selected only while it's painted, as docs/decisions/transcript-keeps-its-texts.md says. The transcript draws Markdown through `crate::texts`. Elsewhere, #[expect] this with why none of those matters there" },
    { path = "gpui_kit::component::text::TextView::html", reason = "the kit's text view ends the app on a text its Markdown parser panics on, gives a long text no height until it's read, and keeps what's selected only while it's painted, as docs/decisions/transcript-keeps-its-texts.md says. The transcript draws Markdown through `crate::texts`. Elsewhere, #[expect] this with why none of those matters there" },
    { path = "gpui_kit::component::text::markdown", reason = "the kit's text view ends the app on a text its Markdown parser panics on, gives a long text no height until it's read, and keeps what's selected only while it's painted, as docs/decisions/transcript-keeps-its-texts.md says. The transcript draws Markdown through `crate::texts`. Elsewhere, #[expect] this with why none of those matters there" },
    { path = "gpui_kit::component::text::html", reason = "the kit's text view ends the app on a text its Markdown parser panics on, gives a long text no height until it's read, and keeps what's selected only while it's painted, as docs/decisions/transcript-keeps-its-texts.md says. The transcript draws Markdown through `crate::texts`. Elsewhere, #[expect] this with why none of those matters there" },
    { path = "gpui_kit::base::TextView::markdown", reason = "the kit's text view ends the app on a text its Markdown parser panics on, gives a long text no height until it's read, and keeps what's selected only while it's painted, as docs/decisions/transcript-keeps-its-texts.md says. The transcript draws Markdown through `crate::texts`. Elsewhere, #[expect] this with why none of those matters there" },
    { path = "gpui_kit::base::TextView::html", reason = "the kit's text view ends the app on a text its Markdown parser panics on, gives a long text no height until it's read, and keeps what's selected only while it's painted, as docs/decisions/transcript-keeps-its-texts.md says. The transcript draws Markdown through `crate::texts`. Elsewhere, #[expect] this with why none of those matters there" },
    { path = "gpui_kit::base::markdown", reason = "the kit's text view ends the app on a text its Markdown parser panics on, gives a long text no height until it's read, and keeps what's selected only while it's painted, as docs/decisions/transcript-keeps-its-texts.md says. The transcript draws Markdown through `crate::texts`. Elsewhere, #[expect] this with why none of those matters there" },
    { path = "gpui_kit::base::html", reason = "the kit's text view ends the app on a text its Markdown parser panics on, gives a long text no height until it's read, and keeps what's selected only while it's painted, as docs/decisions/transcript-keeps-its-texts.md says. The transcript draws Markdown through `crate::texts`. Elsewhere, #[expect] this with why none of those matters there" },
    { path = "gpui_kit::component::text::TextViewState::markdown", reason = "the kit's text view ends the app on a text its Markdown parser panics on, gives a long text no height until it's read, and keeps what's selected only while it's painted, as docs/decisions/transcript-keeps-its-texts.md says. The transcript draws Markdown through `crate::texts`. Elsewhere, #[expect] this with why none of those matters there" },
    { path = "gpui_kit::component::text::TextViewState::html", reason = "the kit's text view ends the app on a text its Markdown parser panics on, gives a long text no height until it's read, and keeps what's selected only while it's painted, as docs/decisions/transcript-keeps-its-texts.md says. The transcript draws Markdown through `crate::texts`. Elsewhere, #[expect] this with why none of those matters there" },
    { path = "gpui_kit::base::SelectableText::new", reason = "the kit's selection is the window's and keeps what's selected only while it's painted, so a text in it lets go of what's selected once its row leaves the window, as docs/decisions/transcript-keeps-its-texts.md says. The transcript selects its texts through `crate::texts` and `crate::selection`. Elsewhere, #[expect] this with why that doesn't matter there" },
    { path = "gpui_kit::base::SelectableText::with_handle", reason = "the kit's selection is the window's and keeps what's selected only while it's painted, so a text in it lets go of what's selected once its row leaves the window, as docs/decisions/transcript-keeps-its-texts.md says. The transcript selects its texts through `crate::texts` and `crate::selection`. Elsewhere, #[expect] this with why that doesn't matter there" },
